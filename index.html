<!doctype html>
<html lang="th" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlowRecover x Life Planner — Adaptive Time-Blocking & Life Planner OS</title>
  <meta name="description"
    content="FlowRecover x Life Planner: จัดตารางงานยืดหยุ่น กู้คืนงานเมื่อถูกขัดจังหวะ เลื่อนคิวอัตโนมัติ บริหารโปรเจค และสมุดวางแผนชีวิตครบวงจร ใช้งานง่ายด้วยมือเดียวบนมือถือ">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlowRecover">
  <meta name="application-name" content="FlowRecover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e222d;
      --surface-2: #262c3a;
      --surface-3: #303748;
      --border: rgba(148, 163, 184, .14);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --amber-2: #fbbf24;
      --emerald: #10b981;
      --emerald-2: #34d399;
      --rose: #f43f5e;
      --sky: #38bdf8;
      --violet: #a78bfa;
      --pink: #f472b6;
      --shadow: 0 14px 34px -16px rgba(0, 0, 0, .65);
      --radius: 20px;
      --nav-h: 70px;
      --glass: rgba(15, 23, 42, .74);
      --side-w: 236px;
    }

    [data-theme=light] {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --surface-2: #f1f4f9;
      --surface-3: #e5eaf2;
      --border: rgba(15, 23, 42, .09);
      --text: #0f172a;
      --muted: #5b6b82;
      --shadow: 0 12px 30px -16px rgba(15, 23, 42, .25);
      --glass: rgba(255, 255, 255, .8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    [hidden] {
      display: none !important
    }

    html {
      -webkit-text-size-adjust: 100%;
      color-scheme: dark
    }

    [data-theme=light] {
      color-scheme: light
    }

    body {
      font-family: 'IBM Plex Sans Thai', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.55;
      -webkit-tap-highlight-color: transparent;
      background-image: radial-gradient(900px 520px at 105% -10%, rgba(245, 158, 11, .11), transparent 60%), radial-gradient(800px 520px at -10% 110%, rgba(16, 185, 129, .11), transparent 60%);
      background-attachment: fixed
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer
    }

    input,
    textarea,
    select {
      font: inherit;
      color: inherit
    }

    a {
      color: var(--amber)
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.25;
      letter-spacing: -.01em
    }

    .mono {
      font-family: 'Inter', sans-serif;
      font-variant-numeric: tabular-nums
    }

    .muted {
      color: var(--muted)
    }

    .center {
      text-align: center
    }

    .sm {
      font-size: .86rem
    }

    .grow {
      flex: 1
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .stack {
      display: grid;
      gap: 12px
    }

    .amber {
      color: var(--amber)
    }

    .emerald {
      color: var(--emerald)
    }

    .rose {
      color: var(--rose)
    }

    /* ---------- Buttons & inputs ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: transform .15s, box-shadow .2s, background .2s, filter .2s;
      white-space: nowrap
    }

    .btn:hover {
      filter: brightness(1.08)
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--amber-2), var(--amber) 55%, #d97706);
      color: #1b1205;
      border: 0;
      box-shadow: 0 10px 24px -10px rgba(245, 158, 11, .75)
    }

    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald-2), var(--emerald) 55%, #059669);
      color: #04150f;
      border: 0;
      box-shadow: 0 10px 24px -10px rgba(16, 185, 129, .75)
    }

    .btn-rose {
      background: linear-gradient(135deg, #fb7185, var(--rose));
      color: #fff;
      border: 0
    }

    .btn-ghost {
      background: transparent
    }

    .btn-sm {
      min-height: 34px;
      padding: 6px 12px;
      font-size: .85rem;
      border-radius: 10px
    }

    .btn-xl {
      width: 100%;
      min-height: 68px;
      font-size: 1.25rem;
      border-radius: 18px;
      font-weight: 700
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-grid;
      place-items: center;
      font-size: 1.05rem;
      transition: background .2s
    }

    .icon-btn:hover {
      background: var(--surface-3)
    }

    .link {
      color: var(--amber);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      outline: none;
      transition: border .2s, box-shadow .2s
    }

    .input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, .15)
    }

    textarea.input {
      resize: vertical;
      min-height: 72px
    }

    .field {
      display: grid;
      gap: 6px
    }

    .field>span {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500
    }

    .field.sm>span {
      font-size: .78rem
    }

    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border)
    }

    .switch input {
      appearance: none;
      width: 48px;
      height: 28px;
      border-radius: 99px;
      background: var(--surface-3);
      position: relative;
      cursor: pointer;
      transition: background .2s;
      flex: none
    }

    .switch input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3)
    }

    .switch input:checked {
      background: var(--emerald)
    }

    .switch input:checked::after {
      transform: translateX(20px)
    }

    /* ---------- Chips & pills ---------- */
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: .76rem;
      font-weight: 600;
      background: var(--surface-3);
      color: var(--muted)
    }

    .chip-amber {
      background: rgba(245, 158, 11, .16);
      color: var(--amber)
    }

    .chip-emerald {
      background: rgba(16, 185, 129, .16);
      color: var(--emerald)
    }

    .chip-rose {
      background: rgba(244, 63, 94, .16);
      color: var(--rose)
    }

    .chip-sky {
      background: rgba(56, 189, 248, .16);
      color: var(--sky)
    }

    .chip-violet {
      background: rgba(167, 139, 250, .16);
      color: var(--violet)
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: .82rem;
      font-weight: 700;
      background: var(--surface-3)
    }

    .pill-amber {
      background: rgba(245, 158, 11, .15);
      color: var(--amber)
    }

    .pill-rose {
      background: rgba(244, 63, 94, .15);
      color: var(--rose)
    }

    .pill-emerald {
      background: rgba(16, 185, 129, .15);
      color: var(--emerald)
    }

    .pill-sky {
      background: rgba(56, 189, 248, .15);
      color: var(--sky)
    }

    .seg {
      display: flex;
      gap: 6px;
      padding: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .seg::-webkit-scrollbar {
      display: none
    }

    .seg button {
      flex: 1;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      transition: all .2s
    }

    .seg button.on {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow)
    }

    /* ---------- Layout ---------- */
    .app-shell {
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)
    }

    .topwrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top)
    }

    .banner {
      display: block;
      padding: 8px 14px 6px;
      font-size: .84rem
    }

    .banner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .banner.pro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, rgba(16, 185, 129, .18), transparent);
      color: var(--emerald)
    }

    .banner.expired {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(244, 63, 94, .14);
      color: var(--rose)
    }

    .banner.trial.urgent .banner-text b {
      color: var(--rose)
    }

    .trial-bar {
      height: 5px;
      border-radius: 9px;
      background: var(--surface-3);
      margin-top: 6px;
      overflow: hidden
    }

    .trial-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--amber));
      border-radius: 9px;
      transition: width .6s
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-family: 'Inter';
      white-space: nowrap
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--amber), var(--emerald));
      color: #0b1220;
      font-size: 1.05rem;
      box-shadow: 0 6px 18px -6px rgba(245, 158, 11, .6)
    }

    .brand-text {
      display: none
    }

    .idea-box {
      flex: 1;
      position: relative
    }

    .idea-box .input {
      min-height: 40px;
      padding-left: 38px;
      border-radius: 99px;
      font-size: .92rem
    }

    .idea-box::before {
      content: "💡";
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .95rem
    }

    .badge-btn {
      position: relative
    }

    .badge-btn b {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--amber);
      color: #111;
      font-size: .68rem;
      display: grid;
      place-items: center;
      padding: 0 4px
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet), var(--sky));
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      flex: none
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 14px
    }

    .view {
      animation: fadeUp .35s ease both
    }

    .view-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .view-head h1 {
      font-size: 1.45rem
    }

    .view-head p {
      color: var(--muted);
      font-size: .9rem
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px
    }

    .card-head h3 {
      margin: 0
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px;
      font-size: .9rem;
      border: 1px dashed var(--border);
      border-radius: 14px
    }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding: 6px 6px env(safe-area-inset-bottom);
      display: flex;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-top: 1px solid var(--border)
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 16px;
      font-size: .7rem;
      font-weight: 600;
      color: var(--muted);
      position: relative;
      transition: color .2s
    }

    .nav-btn .ico {
      font-size: 1.35rem;
      line-height: 1;
      transition: transform .25s
    }

    .nav-btn.on {
      color: var(--amber)
    }

    .nav-btn.on .ico {
      transform: translateY(-2px) scale(1.12)
    }

    .nav-btn.on::before {
      content: "";
      position: absolute;
      inset: 4px 10%;
      border-radius: 14px;
      background: rgba(245, 158, 11, .12);
      z-index: -1
    }

    .side-brand {
      display: none
    }

    /* ---------- Focus cockpit ---------- */
    .cockpit {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 14px;
      border: 1px solid rgba(245, 158, 11, .35);
      background: radial-gradient(500px 220px at 100% 0, rgba(245, 158, 11, .14), transparent 70%), var(--surface)
    }

    .cockpit.interrupting {
      border-color: rgba(244, 63, 94, .5);
      background: radial-gradient(500px 240px at 100% 0, rgba(244, 63, 94, .18), transparent 70%), var(--surface)
    }

    .cockpit.idle {
      border-color: var(--border)
    }

    .cockpit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .cockpit-title {
      font-size: 1.5rem
    }

    .big-timer {
      font-family: 'Inter';
      font-weight: 800;
      font-size: clamp(3rem, 13vw, 4.6rem);
      letter-spacing: -.03em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      background: linear-gradient(180deg, var(--text), var(--muted));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .big-timer.warn {
      background: linear-gradient(180deg, var(--amber-2), var(--rose));
      -webkit-background-clip: text;
      background-clip: text
    }

    .interrupting .big-timer {
      background: linear-gradient(180deg, #fda4af, var(--rose));
      -webkit-background-clip: text;
      background-clip: text
    }

    .bar {
      height: 10px;
      border-radius: 9px;
      background: var(--surface-3);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--emerald), var(--amber));
      transition: width .8s
    }

    .interrupt-btn {
      animation: glow 2.6s ease-in-out infinite
    }

    .bookmark-note {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(56, 189, 248, .1);
      border: 1px solid rgba(56, 189, 248, .25);
      font-size: .9rem
    }

    .bookmark-note.sm {
      font-size: .8rem;
      padding: 6px 10px;
      margin-top: 6px
    }

    .paused-task {
      padding: 12px;
      border-radius: 14px;
      background: var(--surface-2);
      font-size: .92rem
    }

    .pulse-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }

    .stat {
      padding: 14px 10px;
      border-radius: 16px;
      background: var(--surface-2);
      text-align: center
    }

    .stat b {
      display: block;
      font-family: 'Inter';
      font-size: 1.5rem;
      font-weight: 800
    }

    .stat span {
      font-size: .75rem;
      color: var(--muted)
    }

    .reflow {
      border-color: rgba(16, 185, 129, .4);
      background: linear-gradient(135deg, rgba(16, 185, 129, .12), transparent 60%), var(--surface)
    }

    .warn-box {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(244, 63, 94, .12);
      color: var(--rose);
      font-size: .88rem;
      margin: 8px 0
    }

    /* ---------- Tasks ---------- */
    .tasks {
      list-style: none;
      display: grid;
      gap: 8px
    }

    .task {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid transparent;
      transition: border .2s, opacity .2s
    }

    .task.live {
      border-color: rgba(245, 158, 11, .55);
      background: linear-gradient(90deg, rgba(245, 158, 11, .1), var(--surface-2))
    }

    .task.done {
      opacity: .55
    }

    .task.done .task-title {
      text-decoration: line-through
    }

    .check {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 2px solid var(--muted);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #04150f;
      transition: all .2s;
      margin-top: 2px
    }

    .task.done .check,
    .check.on {
      background: var(--emerald);
      border-color: var(--emerald)
    }

    .task-main {
      flex: 1;
      min-width: 0
    }

    .task-time {
      font-size: .8rem;
      color: var(--amber);
      font-weight: 600
    }

    .task-title {
      font-weight: 600;
      margin: 2px 0 6px;
      word-break: break-word
    }

    .task-actions {
      display: flex;
      gap: 2px
    }

    .form-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr
    }

    .form-grid .full {
      grid-column: 1/-1
    }

    .streak {
      font-family: 'Inter';
      font-weight: 800;
      color: var(--amber)
    }

    /* ---------- Projects ---------- */
    .proj {
      padding: 0;
      overflow: hidden
    }

    .proj-head {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px;
      cursor: pointer;
      width: 100%;
      text-align: left
    }

    .proj-head:hover {
      background: var(--surface-2)
    }

    .ring {
      --p: 0;
      width: 54px;
      height: 54px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--emerald) calc(var(--p)*1%), var(--surface-3) 0);
      font-family: 'Inter';
      font-weight: 800;
      font-size: .8rem
    }

    .ring::before {
      content: "";
      position: absolute
    }

    .ring span {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center
    }

    .proj-body {
      padding: 0 16px 16px;
      display: grid;
      gap: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px
    }

    .steps {
      list-style: none;
      position: relative;
      display: grid;
      gap: 8px;
      padding-left: 18px
    }

    .steps::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--surface-3)
    }

    .step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--surface-2)
    }

    .step::before {
      content: "";
      position: absolute;
      left: -17px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sc, var(--muted));
      box-shadow: 0 0 0 3px var(--surface)
    }

    .step .grow {
      word-break: break-word
    }

    .st-btn {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: .74rem;
      font-weight: 700;
      background: color-mix(in srgb, var(--sc) 18%, transparent);
      color: var(--sc);
      min-width: 72px
    }

    .links {
      list-style: none;
      display: grid;
      gap: 6px
    }

    .links li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--surface-2)
    }

    .links a {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
      font-weight: 600
    }

    .map-wrap {
      overflow-x: auto;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border)
    }

    .map-wrap svg {
      display: block;
      min-width: 820px;
      width: 100%;
      height: auto
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: .8rem;
      color: var(--muted);
      margin-top: 10px
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px;
      vertical-align: middle
    }

    /* ---------- Planner ---------- */
    .planner-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .shortcuts {
      display: flex;
      gap: 6px
    }

    .shortcuts button {
      width: 52px;
      height: 44px;
      border-radius: 14px;
      font-family: 'Inter';
      font-weight: 800;
      font-size: .85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all .2s
    }

    .shortcuts button.on {
      background: linear-gradient(135deg, var(--amber), #d97706);
      color: #160f02;
      border-color: transparent;
      box-shadow: 0 8px 20px -10px rgba(245, 158, 11, .8)
    }

    .sec-title {
      font-size: 1.15rem;
      margin: 4px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dims {
      display: grid;
      gap: 10px
    }

    .dim {
      padding: 14px;
      border-radius: 16px;
      background: var(--surface-2);
      border-left: 4px solid var(--dc);
      display: grid;
      gap: 8px
    }

    .dim-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .dim-head b {
      font-size: .95rem
    }

    .dim-head small {
      color: var(--muted);
      display: block;
      font-size: .75rem
    }

    .stars {
      display: inline-flex;
      gap: 2px
    }

    .stars button {
      font-size: 1.3rem;
      line-height: 1;
      padding: 2px;
      filter: grayscale(1) opacity(.35);
      transition: transform .15s, filter .15s
    }

    .stars button.on {
      filter: none
    }

    .stars button:hover {
      transform: scale(1.2)
    }

    .hours {
      display: grid;
      gap: 6px
    }

    .hour {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 8px
    }

    .hour b {
      font-family: 'Inter';
      font-size: .82rem;
      color: var(--amber);
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      background: var(--surface-2)
    }

    .hour .input {
      min-height: 40px
    }

    .dream {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .dream-tile {
      border-radius: 18px;
      padding: 14px;
      display: grid;
      gap: 8px;
      color: #fff;
      min-height: 150px
    }

    .dream-tile b {
      font-family: 'Inter';
      font-size: 1rem
    }

    .dream-tile small {
      opacity: .85
    }

    .dream-tile textarea {
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .22);
      color: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      min-height: 70px;
      resize: vertical;
      outline: none
    }

    .dream-tile textarea::placeholder {
      color: rgba(255, 255, 255, .7)
    }

    .mountain {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 10px 0 4px
    }

    .mt-row {
      width: var(--w);
      min-width: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      font-family: 'Inter';
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      position: relative;
      transition: all .3s
    }

    .mt-row.on {
      background: linear-gradient(90deg, rgba(16, 185, 129, .35), rgba(16, 185, 129, .18));
      color: var(--text)
    }

    .mt-row.cur {
      background: linear-gradient(90deg, var(--amber), #d97706);
      color: #140d02;
      box-shadow: 0 8px 22px -10px rgba(245, 158, 11, .9)
    }

    .mt-row em {
      position: absolute;
      right: -30px;
      font-style: normal;
      font-size: 1.3rem;
      animation: bob 1.6s ease-in-out infinite
    }

    .habit-grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      font-size: .82rem
    }

    .habit-grid th {
      color: var(--muted);
      font-weight: 600;
      font-size: .74rem
    }

    .habit-grid td:first-child {
      text-align: left;
      font-weight: 600;
      padding-right: 6px;
      word-break: break-word
    }

    .hcell {
      width: 100%;
      aspect-ratio: 1;
      max-width: 40px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: .9rem;
      transition: all .2s;
      margin: auto
    }

    .hcell.on {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #04150f;
      transform: scale(1.04)
    }

    .hcell.today {
      outline: 2px solid var(--amber);
      outline-offset: 1px
    }

    .moods {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .mood-btn {
      display: grid;
      justify-items: center;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      min-width: 62px;
      font-size: .72rem;
      color: var(--muted);
      transition: all .2s
    }

    .mood-btn span {
      font-size: 1.6rem
    }

    .mood-btn.on {
      border-color: var(--amber);
      background: rgba(245, 158, 11, .14);
      color: var(--text);
      transform: translateY(-2px)
    }

    .mood-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px
    }

    .mood-strip div {
      text-align: center;
      padding: 8px 0;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 1.3rem
    }

    .mood-strip small {
      display: block;
      font-size: .68rem;
      color: var(--muted)
    }

    .money {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .money .stat b {
      font-size: 1.15rem
    }

    .crud-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      align-items: end;
      margin-bottom: 12px
    }

    .rows {
      list-style: none;
      display: grid;
      gap: 6px
    }

    .row-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: .88rem
    }

    .row-item>div {
      flex: 1;
      min-width: 0;
      word-break: break-word
    }

    .sum {
      font-family: 'Inter';
      font-weight: 800;
      color: var(--amber)
    }

    .tiny-formula {
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(167, 139, 250, .16), rgba(56, 189, 248, .1));
      font-size: .95rem
    }

    /* ---------- Guide ---------- */
    .toc {
      list-style: none;
      display: grid;
      gap: 8px
    }

    .toc button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      text-align: left;
      font-weight: 600;
      transition: all .2s
    }

    .toc button .n {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--surface-3);
      font-family: 'Inter';
      font-size: .85rem
    }

    .toc button.on {
      border-color: var(--amber);
      background: rgba(245, 158, 11, .1)
    }

    .toc button.on .n {
      background: var(--amber);
      color: #160f02
    }

    .gsteps {
      list-style: none;
      display: grid;
      gap: 12px;
      counter-reset: s
    }

    .gsteps li {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: start
    }

    .gsteps li::before {
      counter-increment: s;
      content: counter(s);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--amber), var(--emerald));
      color: #0b1220;
      font-family: 'Inter';
      font-weight: 800
    }

    .gsteps b {
      display: block;
      margin-bottom: 2px
    }

    .gsteps p {
      color: var(--muted);
      font-size: .9rem
    }

    /* ---------- Auth screen ---------- */
    .auth {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 18px
    }

    .auth-card {
      width: min(480px, 100%);
      display: grid;
      gap: 20px;
      text-align: center
    }

    .auth-logo {
      width: 84px;
      height: 84px;
      margin: 0 auto;
      border-radius: 26px;
      display: grid;
      place-items: center;
      font-size: 2.6rem;
      background: linear-gradient(135deg, var(--amber), var(--emerald));
      box-shadow: 0 20px 50px -14px rgba(245, 158, 11, .7);
      animation: float 4s ease-in-out infinite
    }

    .auth h1 {
      font-size: clamp(1.7rem, 6vw, 2.3rem);
      font-family: 'Inter', 'IBM Plex Sans Thai';
      font-weight: 800
    }

    .auth h1 span {
      background: linear-gradient(90deg, var(--amber), var(--emerald));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .feat {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left
    }

    .feat div {
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: .82rem
    }

    .feat b {
      display: block;
      font-size: .9rem;
      margin-bottom: 2px
    }

    .gbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      border-radius: 16px;
      background: #fff;
      color: #1f2937;
      font-weight: 700;
      font-size: 1.02rem;
      box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .6);
      transition: transform .15s
    }

    .gbtn:active {
      transform: scale(.98)
    }

    .gbtn svg {
      width: 22px;
      height: 22px
    }

    /* ---------- Dialogs ---------- */
    dialog {
      margin: auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 24px;
      padding: 0;
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100dvh - 32px);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .75)
    }

    dialog:modal {
      overscroll-behavior: contain
    }

    dialog::backdrop {
      background: rgba(2, 6, 23, .72);
      backdrop-filter: blur(6px);
      overflow: hidden;
      overscroll-behavior: contain
    }

    dialog[open] {
      animation: pop .28s ease both
    }

    .dlg-body {
      padding: 22px;
      display: grid;
      gap: 14px
    }

    .dlg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .paywall-hero {
      text-align: center;
      display: grid;
      gap: 10px
    }

    .lock {
      width: 76px;
      height: 76px;
      margin: 0 auto;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      background: linear-gradient(135deg, rgba(245, 158, 11, .25), rgba(244, 63, 94, .2));
      border: 1px solid rgba(245, 158, 11, .4)
    }

    .price {
      padding: 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(245, 158, 11, .16), rgba(16, 185, 129, .12));
      border: 1px solid rgba(245, 158, 11, .35);
      display: grid;
      gap: 10px
    }

    .price-num {
      font-family: 'Inter';
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1
    }

    .price-num small {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600
    }

    .checks {
      list-style: none;
      display: grid;
      gap: 6px;
      text-align: left;
      font-size: .9rem
    }

    .checks li::before {
      content: "✓ ";
      color: var(--emerald);
      font-weight: 800
    }

    .safe {
      padding: 12px;
      border-radius: 14px;
      background: rgba(16, 185, 129, .1);
      border: 1px solid rgba(16, 185, 129, .3);
      font-size: .86rem;
      text-align: left
    }

    .sim {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .sim button {
      padding: 10px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: .8rem;
      font-weight: 600;
      text-align: left;
      line-height: 1.35
    }

    .sim button:hover {
      border-color: var(--amber)
    }

    .owner {
      padding: 14px;
      border-radius: 16px;
      border: 1px dashed rgba(167, 139, 250, .5);
      background: rgba(167, 139, 250, .06);
      display: grid;
      gap: 10px
    }

    /* ---------- Share view ---------- */
    .share-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 60px;
      display: grid;
      gap: 14px
    }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
      transform: translateX(-50%) translateY(20px);
      z-index: 100;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      font-size: .9rem;
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .5)
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    /* ---------- Animations ---------- */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.95) translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 10px 24px -10px rgba(245, 158, 11, .7)
      }

      50% {
        box-shadow: 0 10px 36px -4px rgba(245, 158, 11, .95)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    /* ---------- Responsive ---------- */
    @media (min-width:560px) {
      .brand-text {
        display: inline
      }

      .dims {
        grid-template-columns: 1fr 1fr
      }

      .dream {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    @media (max-width:420px) {
      .form-grid {
        grid-template-columns: 1fr
      }

      .feat {
        grid-template-columns: 1fr
      }

      .money .stat b {
        font-size: .98rem
      }
    }

    @media (min-width:860px) {
      .grid-2 {
        grid-template-columns: 1.35fr 1fr;
        align-items: start
      }

      .grid-2b {
        grid-template-columns: 1fr 1fr;
        align-items: start
      }

      .dims {
        grid-template-columns: repeat(3, 1fr)
      }

      .guide-layout {
        grid-template-columns: 320px 1fr;
        align-items: start
      }
    }

    @media (min-width:1024px) {
      .bottom-nav {
        top: 0;
        bottom: 0;
        right: auto;
        width: var(--side-w);
        height: auto;
        flex-direction: column;
        justify-content: flex-start;
        gap: 6px;
        padding: 20px 14px;
        border-top: 0;
        border-right: 1px solid var(--border)
      }

      .side-brand {
        display: flex;
        margin: 0 6px 22px
      }

      .nav-btn {
        flex: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
        padding: 13px 16px;
        font-size: .95rem
      }

      .nav-btn.on::before {
        inset: 0
      }

      .app-shell {
        padding-left: var(--side-w);
        padding-bottom: 30px
      }

      .topbar .brand {
        display: none
      }

      #toast {
        bottom: 28px;
        left: calc(50% + var(--side-w)/2)
      }

      main {
        padding: 22px 26px
      }
    }

    /* ---------- i18n + payment additions ---------- */
    .lang-btn {
      min-width: 44px;
      height: 36px;
      padding: 0 10px;
      border-radius: 12px;
      font-family: 'Inter';
      font-weight: 800;
      font-size: .78rem;
      background: var(--surface-2);
      border: 1px solid var(--border)
    }

    .auth-lang {
      display: flex;
      justify-content: flex-end
    }

    .pay-opts {
      display: grid;
      gap: 10px
    }

    .pay-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      text-align: left;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      transition: border .2s, transform .15s
    }

    .pay-opt:hover {
      border-color: var(--amber)
    }

    .pay-opt:active {
      transform: scale(.98)
    }

    .pay-opt .pay-ico {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: linear-gradient(135deg, rgba(245, 158, 11, .22), rgba(16, 185, 129, .18))
    }

    .pay-opt span:nth-child(2) {
      flex: 1;
      min-width: 0
    }

    .pay-opt b {
      display: block
    }

    .pay-opt small {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35
    }

    .pay-opt em {
      font-style: normal;
      font-family: 'Inter';
      font-weight: 800;
      color: var(--amber)
    }

    .pay-badges {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap
    }
  </style>
</head>

<body>

  <div id="share-view" hidden></div>
  <section id="auth-screen" class="auth" hidden></section>

  <div id="app" hidden>
    <nav class="bottom-nav" id="bottom-nav"></nav>
    <div class="app-shell">
      <div class="topwrap">
        <div id="trial-banner" class="banner"></div>
        <header class="topbar">
          <div class="brand"><span class="brand-logo">⚡</span><span class="brand-text">FlowRecover</span></div>
          <form class="idea-box" data-form="idea" id="idea-form" autocomplete="off">
            <input class="input" name="idea" id="idea-input" enterkeyhint="done">
          </form>
          <button class="icon-btn badge-btn" data-act="ideas" id="btn-ideas">🗒️<b id="idea-count" hidden>0</b></button>
          <button class="lang-btn" data-act="lang" id="btn-lang"></button>
          <button class="icon-btn" data-act="theme" id="btn-theme">🌙</button>
          <button class="avatar" data-act="account" id="btn-account"></button>
        </header>
      </div>
      <main>
        <section class="view" id="view-focus" hidden></section>
        <section class="view" id="view-queue" hidden></section>
        <section class="view" id="view-projects" hidden></section>
        <section class="view" id="view-planner" hidden></section>
        <section class="view" id="view-guide" hidden></section>
      </main>
    </div>
  </div>

  <dialog id="paywall" aria-labelledby="paywall-title">
    <div class="dlg-body" id="paywall-body"></div>
  </dialog>
  <dialog id="pay-dlg" closedby="any" aria-labelledby="pay-title">
    <div class="dlg-body" id="pay-body"></div>
  </dialog>
  <dialog id="account-dlg" closedby="any" aria-labelledby="account-title">
    <div class="dlg-body" id="account-body"></div>
  </dialog>
  <dialog id="ideas-dlg" closedby="any" aria-labelledby="ideas-title">
    <div class="dlg-body" id="ideas-body"></div>
  </dialog>
  <dialog id="share-dlg" closedby="any" aria-labelledby="share-title">
    <div class="dlg-body" id="share-body"></div>
  </dialog>
  <dialog id="demo-dlg" closedby="any" aria-labelledby="demo-title">
    <form class="dlg-body" data-form="demoLogin" id="demo-login-form"></form>
  </dialog>
  <dialog id="admin-dlg" closedby="any" aria-labelledby="admin-dlg-title">
    <form class="dlg-body" data-form="adminUnlock" id="admin-unlock-form"></form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    /* =====================================================================
       CONFIG — แก้ไขค่าเหล่านี้ก่อนขึ้นระบบจริง (ดู SETUP.md)
       ===================================================================== */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCi1nDNqoiAQ8V1j_kSPcUOi6rGbnLifBw",
      authDomain: "flowrecover-app.firebaseapp.com",
      projectId: "flowrecover-app",
      storageBucket: "flowrecover-app.firebasestorage.app",
      messagingSenderId: "1061606974975",
      appId: "1:1061606974975:web:70d3d0f7cf2411dde4f3ca",
      measurementId: "G-RZ2F9H1KQE"
    };
    // 💳 Card subscription (auto-renews monthly)
    const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/8x2dR9fVC8CCb1d3PS00001";
    // 📱 PromptPay QR (one-time 99฿ = 30 days). Stripe PromptPay does not support subscriptions,
    //    so create a second one-time Payment Link with PromptPay enabled and paste it here.
    //    Leave empty to fall back to STRIPE_PAYMENT_LINK.
    const STRIPE_QR_LINK = "https://buy.stripe.com/dRmaEXbFm4mm3yL72400002";
    const META_PIXEL_ID = "";            // e.g. "123456789012345" — enables ad conversion tracking
    const SHOW_OWNER_SIMULATOR = true;   // ตั้งเป็น false เมื่อเปิดให้ลูกค้าใช้งานจริง
    // 🔑 Admin & Lifetime Access
    const ADMIN_SECRET_KEY = "FLOW-ADMIN-LIFETIME"; // รหัสสำหรับกรอกเพื่อปลดล็อกฟรีตลอดชีพ
    const ADMIN_EMAILS = ["btigert02@gmail.com"];     // อีเมลที่ได้รับสิทธิ์ฟรีตลอดชีพอัตโนมัติเมื่อล็อกอิน
    const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.12.2";
    const FIREBASE_READY = !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");
    const TRIAL_MS = 7 * 24 * 3600 * 1000;
    const PASS_MS = 30 * 24 * 3600 * 1000;
    const DAY_END = 22 * 60;
    const LS_KEY = "flowrecover.lifeplanner.v1";
    const LV = [15, 30, 50, 75, 100, 130, 165, 205, 250, 300];

    /* ===================== Helpers ===================== */
    const $ = s => document.querySelector(s);
    const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
    const pad = n => String(n).padStart(2, "0");
    const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parseD = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
    const addDays = (k, n) => { const d = parseD(k); d.setDate(d.getDate() + n); return dkey(d); };
    const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
    const fmt = m => { m = Math.max(0, Math.round(m)); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
    const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
    const fmtDur = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
    const fmtClock = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const trunc = (s, n) => (s = String(s || "")).length > n ? s.slice(0, n - 1) + "…" : s;
    const getPath = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
    const setPath = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => { if (a[k] == null || typeof a[k] !== "object") a[k] = {}; a = a[k]; }); a[ks.at(-1)] = v; };
    const b64e = s => { const b = new TextEncoder().encode(s); let bin = ""; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
    const b64d = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); };

    /* ===================== i18n ===================== */
    let LANG = "th";
    const L = (th, en) => LANG === "en" ? en : th;
    const locale = () => LANG === "en" ? "en-US" : "th-TH";
    const money = n => (Number(n) || 0).toLocaleString(locale(), { maximumFractionDigits: 2 });
    const DAYS = { th: ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"], en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] };
    const MONTHS = { th: ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."], en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"] };
    const dayName = d => DAYS[LANG][d.getDay()];
    const fmtDate = k => { if (!k) return ""; const d = parseD(k); return LANG === "en" ? `${dayName(d)}, ${MONTHS.en[d.getMonth()]} ${d.getDate()}` : `${dayName(d)} ${d.getDate()} ${MONTHS.th[d.getMonth()]}`; };
    const monthLabel = () => { const d = new Date(); return LANG === "en" ? `${MONTHS.en[d.getMonth()]} ${d.getFullYear()}` : `${MONTHS.th[d.getMonth()]} ${d.getFullYear() + 543}`; };
    const fmtDT = ms => new Date(ms).toLocaleString(locale(), { dateStyle: "medium", timeStyle: "short" });

    /* ===================== State ===================== */
    const defaults = () => ({
      user: null, lang: null,
      sub: { subscription_status: "trial", trial_start_at: Date.now() },
      theme: "dark", tab: "focus", plannerSec: "cg", projSub: "list", guideTopic: 0,
      queueDate: null, plannerDate: null, openProject: null,
      ideas: [], tasks: [], routines: [], projects: [],
      focus: { interrupt: null, log: [], lastReflow: null },
      alerts: { topic: "", sound: true, vibrate: true, notify: false, lead: 0, fired: {} },
      planner: {
        goals: {}, monthly: {}, daily: {}, dream: {},
        habits: [], habitLog: {}, tiny: { after: "", will: "" }, obstacle: "", solution: "",
        mood: {}, booster: "",
        finance: { income: 0, goal: 50000, saved: 0 },
        expenses: [], workouts: [], meals: [], trips: [], media: []
      }
    });
    function hydrate(o) {
      const d = defaults(); o = o || {};
      const P = o.planner || {};
      return {
        ...d, ...o,
        sub: { ...d.sub, ...o.sub }, focus: { ...d.focus, ...o.focus }, alerts: { ...d.alerts, ...o.alerts },
        planner: { ...d.planner, ...P, tiny: { ...d.planner.tiny, ...P.tiny }, finance: { ...d.planner.finance, ...P.finance } }
      };
    }
    let state;
    try { state = hydrate(JSON.parse(localStorage.getItem(LS_KEY) || "null")); } catch { state = hydrate(null); }
    const urlLang = new URLSearchParams(location.search).get("lang");
    state.lang = ["th", "en"].includes(urlLang) ? urlLang : state.lang || ((navigator.language || "th").toLowerCase().startsWith("th") ? "th" : "en");
    LANG = state.lang;
    state.queueDate = dkey(); state.plannerDate = dkey();
    const P = () => state.planner;

    let fb = null, cloudTimer = null;
    function save() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { console.warn(e); }
      if (fb && state.user && !state.user.demo) { clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSave, 1200); }
    }
    async function cloudSave() {
      try {
        const { user, sub, queueDate, plannerDate, openProject, ...rest } = state;
        await fb.setDoc(fb.doc(fb.db, "users", state.user.uid, "data", "main"), { payload: JSON.stringify(rest), updated_at: fb.serverTimestamp() });
      } catch (e) { console.warn("cloud save failed", e); }
    }

    /* ===================== Meta Pixel (ad conversion tracking) ===================== */
    function loadPixel() {
      if (!META_PIXEL_ID) return;
      !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", META_PIXEL_ID); fbq("track", "PageView");
    }
    const track = (ev, params = {}) => { try { window.fbq?.("track", ev, params); } catch { } };

    /* ===================== Subscription ===================== */
    function subInfo() {
      const s = state.sub;
      if (s.is_admin || s.plan === "lifetime_admin") {
        return { pro: true, until: null, is_admin: true };
      }
      if (s.subscription_status === "pro") {
        if (s.pro_until && Date.now() > s.pro_until) return { pro: false, rem: 0, pct: 0, expired: true, lapsed: true };
        return { pro: true, until: s.pro_until || null };
      }
      const rem = (s.trial_start_at || Date.now()) + TRIAL_MS - Date.now();
      return { pro: false, rem, pct: Math.max(0, Math.min(1, rem / TRIAL_MS)), expired: rem <= 0 || s.subscription_status === "canceled" };
    }
    function pay(method) {
      const link = method === "qr" ? (STRIPE_QR_LINK || STRIPE_PAYMENT_LINK) : STRIPE_PAYMENT_LINK;
      const q = new URLSearchParams({ prefilled_email: state.user?.email || "", locale: LANG });
      if (state.user && !state.user.demo) q.set("client_reference_id", state.user.uid);
      track("InitiateCheckout", { value: 99, currency: "THB", content_name: method === "qr" ? "PromptPay 30 days" : "Card monthly" });
      try { (window.top || window).location.href = `${link}?${q}`; } catch (_) { location.href = `${link}?${q}`; }
    }
    function handleStripeReturn() {
      const q = new URLSearchParams(location.search);
      const ok = q.get("stripe_status") === "success" || q.get("payment") === "success";
      const cancel = q.get("stripe_status") === "cancel" || q.get("payment") === "cancel";
      if (ok) {
        const isQr = q.get("plan") === "qr";
        const base = Math.max(Date.now(), state.sub.pro_until || 0);
        state.sub = { ...state.sub, subscription_status: "pro", pro_pending_at: Date.now(), simulated: false, pro_until: isQr ? base + PASS_MS : null };
        save(); track("Purchase", { value: 99, currency: "THB" });
        setTimeout(() => toast(L("🎉 ชำระเงินสำเร็จ! ยินดีต้อนรับสู่ FlowRecover PRO", "🎉 Payment successful! Welcome to FlowRecover PRO")), 700);
      } else if (cancel) setTimeout(() => toast(L("ยกเลิกการชำระเงินแล้ว — ข้อมูลของคุณยังอยู่ครบ", "Payment cancelled — your data is safe")), 700);
      if (ok || cancel) {
        ["stripe_status", "payment", "plan"].forEach(k => q.delete(k));
        history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
      }
    }
    function grantAdminLifetime(notify = true) {
      state.sub = { ...state.sub, subscription_status: "pro", plan: "lifetime_admin", is_admin: true, pro_until: null, simulated: false };
      save(); renderBanner(); checkPaywall(); if ($("#account-dlg").open) renderAccount();
      if (notify) toast(L("🎉 ปลดล็อกสิทธิ์ Admin ฟรีตลอดชีพเรียบร้อยแล้ว!", "🎉 Lifetime Admin PRO unlocked successfully!"));
    }
    function checkAdminUrl() {
      const q = new URLSearchParams(location.search);
      const key = q.get("admin_key") || q.get("admin_code") || q.get("code");
      if (key && key.trim().toUpperCase() === ADMIN_SECRET_KEY.toUpperCase()) {
        grantAdminLifetime(true);
        ["admin_key", "admin_code", "code"].forEach(k => q.delete(k));
        history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
      }
    }
    function applyServerSub(d) {
      if (state.sub.simulated || state.sub.is_admin || state.sub.plan === "lifetime_admin") return;
      const start = d.trial_start_at?.toMillis?.() ?? state.sub.trial_start_at ?? Date.now();
      let status = d.subscription_status || "trial";
      let until = d.pro_until?.toMillis?.() ?? null;
      // Optimistic PRO after Stripe redirect while waiting for the webhook (max 30 min)
      if (status !== "pro" && state.sub.pro_pending_at && Date.now() - state.sub.pro_pending_at < 30 * 60e3) { status = "pro"; until = state.sub.pro_until || null; }
      state.sub = { ...state.sub, subscription_status: status, trial_start_at: start, pro_until: until };
      save(); renderBanner(); checkPaywall();
    }
    function simulate(mode) {
      const now = Date.now(), base = { simulated: true };
      if (mode === 1) state.sub = { ...base, subscription_status: "trial", trial_start_at: now };
      if (mode === 2) state.sub = { ...base, subscription_status: "trial", trial_start_at: now - 6 * 864e5 };
      if (mode === 3) state.sub = { ...base, subscription_status: "trial", trial_start_at: now - TRIAL_MS - 60e3 };
      if (mode === 4) state.sub = { ...base, subscription_status: "pro", trial_start_at: now - 3 * 864e5 };
      save(); renderBanner(); checkPaywall();
      if ($("#account-dlg").open) renderAccount();
      if ($("#paywall").open) renderPaywall();
      toast(["",
        L("🎁 จำลอง: เริ่มทดลองใช้ เหลือ 7 วัน", "🎁 Simulated: trial started, 7 days left"),
        L("⏳ จำลอง: เหลือ 1 วัน", "⏳ Simulated: 1 day left"),
        L("🔒 จำลอง: หมดเวลาทดลองใช้", "🔒 Simulated: trial expired"),
        L("👑 จำลอง: ชำระ PRO สำเร็จ", "👑 Simulated: PRO payment successful")][mode]);
    }

    /* ===================== Seed data ===================== */
    function seed() {
      if (state.tasks.length || state.projects.length || state.routines.length) return;
      const today = dkey(), n = Math.max(0, Math.floor(nowMin() / 15) * 15);
      const st = arr => arr.map(([title, status]) => ({ id: uid(), title, status }));
      const p1 = {
        id: uid(), title: L("เปิดตัวเว็บไซต์ลูกค้า A", "Client A website launch"), monthlyGoal: L("ปิดงานลูกค้า 2 รายในเดือนนี้", "Close 2 client projects this month"), manual: 0,
        coordinator: { name: L("คุณมิ้นท์ (PM)", "Mint (PM)"), contact: "mint@example.com • 081-234-5678" },
        links: [{ id: uid(), label: "Brief & Sitemap (Google Drive)", url: "https://drive.google.com/" }],
        steps: st([[L("เก็บ Requirement", "Gather requirements"), "done"], [L("ออกแบบ Wireframe", "Wireframes"), "done"], [L("พัฒนาหน้า Landing", "Build landing page"), "doing"], [L("รอ Feedback ลูกค้า", "Waiting for client feedback"), "waiting"], [L("ขึ้นระบบจริง", "Go live"), "todo"]])
      };
      const p2 = {
        id: uid(), title: L("คอร์สออนไลน์ Excel", "Excel online course"), monthlyGoal: L("สร้างรายได้เสริม 10,000 ฿", "Earn 10,000 ฿ side income"), manual: 0,
        coordinator: { name: L("พี่บอส (ตัดต่อ)", "Boss (editor)"), contact: "Line: boss.edit" }, links: [],
        steps: st([[L("เขียนสคริปต์ 5 บท", "Write 5 scripts"), "done"], [L("อัดวิดีโอ", "Record videos"), "doing"], [L("ตัดต่อ", "Edit"), "todo"], [L("เปิดขาย", "Launch sales"), "todo"]])
      };
      state.projects = [p1, p2];
      const T = (title, start, dur, projectId, priority) => ({ id: uid(), title, date: today, start: Math.max(0, start), dur, projectId, priority, done: false, bookmark: "" });
      state.tasks = [
        T(L("พัฒนาหน้า Landing (Hero + Pricing)", "Build landing page (Hero + Pricing)"), n - 15, 60, p1.id, "main"),
        T(L("ตอบอีเมลลูกค้า & นัดประชุม", "Reply to client emails & schedule meeting"), n + 60, 30, null, "secondary"),
        T(L("อัดวิดีโอคอร์ส บทที่ 3", "Record course video, lesson 3"), n + 105, 60, p2.id, "main"),
        T(L("จัดเอกสารบัญชีประจำเดือน", "Organize monthly accounting docs"), n + 180, 45, null, "secondary")
      ];
      state.routines = [
        { id: uid(), title: L("ออกกำลังกาย 20 นาที", "Exercise 20 minutes"), freq: "daily", time: "06:30", created: addDays(today, -6), log: { [addDays(today, -1)]: true, [addDays(today, -2)]: true, [addDays(today, -3)]: true } },
        { id: uid(), title: L("อ่านหนังสือ 15 หน้า", "Read 15 pages"), freq: "eod", time: "21:00", created: today, log: {} },
        { id: uid(), title: L("เช็กยอดขายประจำวัน", "Check daily sales"), freq: "weekday", time: "09:00", created: addDays(today, -10), log: {} }
      ];
      if (!P().habits.length) P().habits = [L("ดื่มน้ำ 8 แก้ว", "Drink 8 glasses of water"), L("นอนก่อน 5 ทุ่ม", "Sleep before 11 PM"), L("ไม่เล่นมือถือก่อนนอน", "No phone before bed")].map(name => ({ id: uid(), name }));
      save();
    }

    /* ===================== Domain helpers ===================== */
    const proj = id => state.projects.find(p => p.id === id);
    const tasksOn = date => state.tasks.filter(t => t.date === date).sort((a, b) => a.start - b.start);
    function currentTask() { const n = nowMin(); return tasksOn(dkey()).find(t => !t.done && t.start <= n && n < t.start + t.dur) || null; }
    function nextTask() { const n = nowMin(); return tasksOn(dkey()).find(t => !t.done && t.start > n) || null; }
    const prog = p => p.steps?.length ? Math.round(p.steps.filter(s => s.status === "done").length / p.steps.length * 100) : (Number(p.manual) || 0);
    const STEP = { todo: ["Todo", "var(--muted)"], doing: ["Doing", "var(--amber)"], waiting: ["Waiting", "var(--sky)"], done: ["Done", "var(--emerald)"] };
    const STEP_ORDER = ["todo", "doing", "waiting", "done"];
    const freqLabel = f => ({ daily: L("ทุกวัน", "Daily"), eod: L("วันเว้นวัน", "Every other day"), weekday: L("จ.-ศ.", "Mon–Fri") }[f]);
    function isDue(r, date) {
      if (r.freq === "weekday") { const g = parseD(date).getDay(); return g >= 1 && g <= 5; }
      if (r.freq === "eod") { const diff = Math.round((parseD(date) - parseD(r.created)) / 864e5); return diff >= 0 && diff % 2 === 0; }
      return true;
    }
    function prevDue(r, d) { for (let i = 0; i < 8; i++) { d = addDays(d, -1); if (parseD(d) < parseD(r.created)) return null; if (isDue(r, d)) return d; } return null; }
    function streak(r) {
      let d = dkey(); if (!r.log?.[d]) d = prevDue(r, d);
      let s = 0; for (let i = 0; i < 500 && d; i++) { if (r.log?.[d]) { s++; d = prevDue(r, d); } else break; }
      return s;
    }
    function consistency(r) {
      let due = 0, done = 0, d = dkey();
      for (let i = 0; i < 30; i++) { if (parseD(d) < parseD(r.created)) break; if (isDue(r, d)) { due++; if (r.log?.[d]) done++; } d = addDays(d, -1); }
      return due ? Math.round(done / due * 100) : 0;
    }
    function points() {
      let h = 0; Object.values(P().habitLog).forEach(m => h += Object.values(m).filter(Boolean).length);
      let r = 0; state.routines.forEach(x => r += Object.values(x.log || {}).filter(Boolean).length);

      const fn = A[el.dataset.act]; if (!fn) return;
      e.preventDefault(); fn(el.dataset, el);
    });
    document.addEventListener("input", e => {
      const el = e.target.closest("[data-bind]"); if (!el) return;
      let v = el.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.num || el.type === "number" || el.type === "range") v = v === "" ? 0 : Number(v);
      setPath(state, el.dataset.bind, v); save();
      if (el.dataset.live === "tiny") $("#tiny-formula").innerHTML = tinyText();
    });
    document.addEventListener("change", e => {
      const el = e.target;
      if (el.dataset.actChange === "plannerDate") { state.plannerDate = el.value || dkey(); renderView(); return; }
      if (el.dataset.bind === "alerts.notify" && el.checked && "Notification" in window) {
        Notification.requestPermission().then(p => { if (p !== "granted") { state.alerts.notify = false; el.checked = false; save(); toast(L("เบราว์เซอร์ไม่อนุญาตการแจ้งเตือน", "Notifications were blocked by the browser")); } else toast(L("🔔 เปิดแจ้งเตือนเบราว์เซอร์แล้ว", "🔔 Browser notifications on")); });
      }
      if (el.dataset.rr) renderView();
    });
    document.addEventListener("submit", e => {
      const f = e.target; e.preventDefault();
      const fd = Object.fromEntries(new FormData(f));
      if (f.dataset.crud) addCrud(f.dataset.crud, fd);
      else if (f.dataset.form) FORMS[f.dataset.form]?.(fd, f);
    });
    $("#paywall").addEventListener("cancel", e => e.preventDefault()); // Paywall cannot be dismissed with Esc / back gesture
    document.addEventListener("keydown", e => {
      if (e.key === "/" && !e.target.closest("input,textarea,select") && state.user) { e.preventDefault(); $("#idea-input").focus(); }
    });

    /* ===================== Auth & boot ===================== */
    function showAuth() { $("#app").hidden = true; $("#auth-screen").hidden = false; if ($("#paywall").open) $("#paywall").close(); }
    function showApp() { $("#auth-screen").hidden = true; $("#app").hidden = false; seed(); renderAll(); }
    async function login() {
      if (fb) {
        try { await fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider()); }
        catch (e) {
          console.error(e);
          if (e.code === "auth/unauthorized-domain") {
            toast(L(`โดเมน ${location.hostname} ยังไม่ได้รับอนุญาตใน Firebase (เพิ่มใน Authorized domains)`, `Domain ${location.hostname} not authorized in Firebase Console`));
          } else {
            toast(L("เข้าสู่ระบบไม่สำเร็จ: ", "Sign-in failed: ") + (e.code || e.message));
          }
        }
      } else $("#demo-dlg").showModal();
    }
    async function logout() {
      if (!confirm(L("ออกจากระบบ? (ข้อมูลยังเก็บไว้ในบัญชีของคุณ)", "Sign out? (your data stays in your account)"))) return;
      ["account-dlg", "paywall", "pay-dlg"].forEach(id => $("#" + id).open && $("#" + id).close());
      if (fb) await fb.signOut(fb.auth);
      else { state.user = null; save(); showAuth(); }
    }
    async function initFirebase() {
      const [app, auth, fs] = await Promise.all([
        import(`${FIREBASE_SDK}/firebase-app.js`), import(`${FIREBASE_SDK}/firebase-auth.js`), import(`${FIREBASE_SDK}/firebase-firestore.js`)
      ]);
      const a = app.initializeApp(FIREBASE_CONFIG);
      fb = {
        auth: auth.getAuth(a), db: fs.getFirestore(a), GoogleAuthProvider: auth.GoogleAuthProvider, signInWithPopup: auth.signInWithPopup, signOut: auth.signOut,
        doc: fs.doc, getDoc: fs.getDoc, setDoc: fs.setDoc, onSnapshot: fs.onSnapshot, serverTimestamp: fs.serverTimestamp
      };
      let unsub = null;
      auth.onAuthStateChanged(fb.auth, async u => {
        unsub?.(); unsub = null;
        if (!u) { state.user = null; save(); showAuth(); return; }
        const switched = state.user?.uid !== u.uid;
        state.user = { uid: u.uid, name: u.displayName || u.email, email: u.email, photo: u.photoURL || "" };
        const uref = fb.doc(fb.db, "users", u.uid);
        try {
          const snap = await fb.getDoc(uref);
          if (!snap.exists()) {
            // First Google sign-in → start 7-day trial
            await fb.setDoc(uref, { email: (u.email || "").toLowerCase(), name: u.displayName || "", photo: u.photoURL || "", trial_start_at: fb.serverTimestamp(), subscription_status: "trial", created_at: fb.serverTimestamp() });
            state.sub = { subscription_status: "trial", trial_start_at: Date.now(), pro_pending_at: state.sub.pro_pending_at, pro_until: state.sub.pro_until };
            track("CompleteRegistration"); track("StartTrial", { value: 0, currency: "THB" });
          }
          if (ADMIN_EMAILS.some(e => e.toLowerCase() === (u.email || "").toLowerCase())) {
            grantAdminLifetime(false);
          }
          unsub = fb.onSnapshot(uref, s => s.exists() && applyServerSub(s.data()));
          const ds = await fb.getDoc(fb.doc(fb.db, "users", u.uid, "data", "main"));
          if (ds.exists()) { const keep = { user: state.user, sub: state.sub, lang: state.lang }; state = hydrate({ ...JSON.parse(ds.data().payload || "{}"), ...keep }); state.queueDate = dkey(); state.plannerDate = dkey(); }
          else { if (switched) { const keep = { user: state.user, sub: state.sub, theme: state.theme, lang: state.lang }; state = hydrate(keep); state.queueDate = dkey(); state.plannerDate = dkey(); } seed(); cloudSave(); }
        } catch (e) { console.error(e); toast(L("โหลดข้อมูลจากคลาวด์ไม่สำเร็จ — ใช้ข้อมูลในเครื่องชั่วคราว", "Couldn't load cloud data — using local data for now")); }
        LANG = state.lang; save(); renderStatic(); showApp();
      });
    }

    /* ---------- Ticker ---------- */
    let tick = 0;
    setInterval(() => {
      if (!state.user || $("#app").hidden) return;
      tick++;
      if (state.tab === "focus") {
        const cur = currentTask(), key = state.focus.interrupt ? "int" : cur ? cur.id : "none:" + (nextTask()?.id || "");
        if (key !== lastCockpitKey && !document.activeElement?.closest?.("#view-focus input, #view-focus textarea, #view-focus select")) renderView();
        else tickCockpit();
      }
      if (tick % 15 === 0) checkAlerts();
      if (tick % 30 === 0) { renderBanner(); checkPaywall(); }
    }, 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && state.user) { renderBanner(); checkPaywall(); checkAlerts(); if (state.tab === "focus") renderView(); } });

    /* ---------- Boot ---------- */
    applyTheme();
    loadPixel();
    if (location.hash.startsWith("#share=")) {
      renderShare();
    } else {
      renderStatic();
      handleStripeReturn();
      checkAdminUrl();
      if (FIREBASE_READY) {
        try { await initFirebase(); }
        catch (e) { console.error(e); fb = null; toast(L("เชื่อมต่อ Firebase ไม่สำเร็จ — ใช้โหมดสาธิต", "Firebase connection failed — using demo mode")); state.user ? showApp() : showAuth(); }
      } else state.user ? showApp() : showAuth();
    }
  </script>
</body>

</html>
