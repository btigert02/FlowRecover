       • Thai income tax (personal / company)
       ===================================================================== */
    const LIVE = {};
    const kpiBox = (v, l, c = "") => `<div class="kpi"><b class="${c}">${v}</b><span>${l}</span></div>`;

    /* ---------- 🔄 Google Calendar: propagate in-app edits & deletes ---------- */
    const tsig = t => `${t.date}|${t.start}|${t.dur}|${t.title}|${t.done ? 1 : 0}`;
    const G_FATAL = e => ["auth", "scope", "disabled"].includes(e?.code) || e?.message === "demo";
    function gObjects() {
      const m = {};
      state.tasks.forEach(t => { if (t.gcalId) m["t:" + t.id] = t.gcalId; });
      state.projects.forEach(p => p.steps.forEach(s => { if (s.gcalId) m["s:" + s.id] = s.gcalId; (s.activities || []).forEach(a => { if (a.gcalId) m["a:" + a.id] = a.gcalId; }); }));
      return m;
    }
    const tStartEnd = t => { const d = parseD(t.date), st = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, t.start); return [st, new Date(st.getTime() + t.dur * 60e3)]; };
    async function gPatchTime(t) {
      const [st, en] = tStartEnd(t);
      const r = await gFetch(`${GCAL()}/${encodeURIComponent(t.gcalId)}`, { method: "PATCH", body: JSON.stringify({ summary: t.title, start: { dateTime: st.toISOString() }, end: { dateTime: en.toISOString() } }) });
      if (r.status === 404 || r.status === 410) { delete t.gcalId; delete t.fromGcal; return; }
      if (!r.ok) throw new GErr("http", r.status);
    }
    let gBusy = false;
    async function gSyncChanges(force = false) {
      if (gBusy || !fb || !state.user || state.user.demo) return 0;
      const G = state.gcal; G.known ||= {};
      state.tasks.forEach(t => { if (t.gcalId && !t.gsig) t.gsig = tsig(t); });
      const before = JSON.stringify(G.known), cur = gObjects();
      const gone = Object.entries(G.known).filter(([k]) => !cur[k]);
      const changed = state.tasks.filter(t => t.gcalId && t.gsig !== tsig(t));
      if (!gone.length && !changed.length) { G.known = cur; if (JSON.stringify(cur) !== before) save(); return 0; }
      if (!gTokenValid("cal")) {
        G.known = { ...G.known, ...cur }; if (JSON.stringify(G.known) !== before) save();
        if (!force) return 0;
        await googleToken(["cal"]);
      }
      gBusy = true; let n = 0;
      try {
        for (const [k, id] of gone) {
          try {
            const r = await gFetch(`${GCAL()}/${encodeURIComponent(id)}`, { method: "DELETE" });
            if (r.ok || r.status === 404 || r.status === 410) { delete G.known[k]; n++; }
          } catch (e) { if (G_FATAL(e)) throw e; delete G.known[k]; console.warn("gcal delete", e); }
        }
        for (const t of changed) {
          try { if (t.fromGcal) await gPatchTime(t); else await gUpsert(t, evTask(t)); n++; }
          catch (e) { if (G_FATAL(e)) throw e; console.warn("gcal update", e); }
          t.gsig = tsig(t);
        }
        G.known = { ...G.known, ...gObjects() };
      } finally { gBusy = false; save(); }
      return n;
    }
    setInterval(() => { gSyncChanges().catch(e => console.warn("gcal sync", e)); }, 15000);

    /* ---------- 📥 Pull events from Google Calendar ---------- */
    async function gList(a, b) {
      const tMin = parseD(a).toISOString(), tMax = parseD(addDays(b, 1)).toISOString();
      let items = [], pageToken = "";
      do {
        const q = new URLSearchParams({ timeMin: tMin, timeMax: tMax, singleEvents: "true", orderBy: "startTime", maxResults: "250" });
        if (pageToken) q.set("pageToken", pageToken);
        const r = await gFetch(`${GCAL()}?${q}`);
        if (!r.ok) throw new GErr("http", r.status, (await r.json().catch(() => ({})))?.error?.message);
        const j = await r.json(); items = items.concat(j.items || []); pageToken = j.nextPageToken || "";
      } while (pageToken && items.length < 2500);
      return items.filter(e => e.status !== "cancelled");
    }
    const evIsMine = e => !!e.extendedProperties?.private?.flowrecover;
    const evDeclined = e => (e.attendees || []).some(x => x.self && x.responseStatus === "declined");
    function evTimes(e) {
      if (e.start?.date) return { allDay: true, a: e.start.date, b: addDays(e.end?.date || addDays(e.start.date, 1), -1) };
      const s = new Date(e.start?.dateTime), en = new Date(e.end?.dateTime || s.getTime() + 36e5);
      return { allDay: false, a: dkey(s), b: dkey(new Date(Math.max(s.getTime(), en.getTime() - 1))), s, en, start: s.getHours() * 60 + s.getMinutes(), dur: Math.max(5, Math.round((en - s) / 6e4)) };
    }
    function importEvent(e) {
      const T = evTimes(e); if (T.allDay) return null;
      const dur = Math.max(5, Math.min(T.dur, 24 * 60 - T.start)), title = e.summary || L("(ไม่มีชื่อ)", "(no title)");
      let t = state.tasks.find(x => x.gcalId === e.id);
      if (t) {
        if (t.fromGcal && (t.date !== T.a || t.start !== T.start || t.dur !== dur || t.title !== title)) { Object.assign(t, { date: T.a, start: T.start, dur, title }); t.gsig = tsig(t); return "upd"; }
        return "same";
      }
      t = { id: uid(), title, date: T.a, start: T.start, dur, projectId: null, priority: "main", done: false, bookmark: e.location ? "📍 " + e.location : "", gcalId: e.id, fromGcal: true, gLink: e.htmlLink || "" };
      t.gsig = tsig(t); state.tasks.push(t); return "add";
    }
    async function gPull(a, b) {
      await gSyncChanges(true);
      const items = await gList(a, b), c = { add: 0, upd: 0, del: 0, allDay: 0 }, seen = new Set();
      for (const e of items) {
        if (evIsMine(e) || evDeclined(e)) continue;
        if (e.start?.date) { c.allDay++; continue; }
        seen.add(e.id);
        const r = importEvent(e); if (r === "add") c.add++; else if (r === "upd") c.upd++;
      }
      state.tasks = state.tasks.filter(t => {
        if (t.fromGcal && !t.done && t.date >= a && t.date <= b && !seen.has(t.gcalId)) { delete state.gcal.known?.["t:" + t.id]; c.del++; return false; }
        return true;
      });
      state.gcal.lastPull = Date.now(); rerender();
      return c;
    }
    const pullMsg = c => L(`📥 ดึงจาก Google Calendar: เพิ่ม ${c.add} • อัปเดต ${c.upd}${c.del ? ` • ลบ ${c.del}` : ""}${c.allDay ? ` • ข้ามนัดทั้งวัน ${c.allDay}` : ""}`, `📥 From Google Calendar: ${c.add} added • ${c.upd} updated${c.del ? ` • ${c.del} removed` : ""}${c.allDay ? ` • ${c.allDay} all-day skipped` : ""}`);

    /* ---------- 📆 Calendar page ---------- */
    function calState() { state.cal ||= {}; const C = state.cal; C.view ||= "month"; C.date ||= dkey(); C.sel ||= dkey(); return C; }
    function calRange() {
      const C = calState();
      if (C.view === "agenda") return [dkey(), addDays(dkey(), 30)];
      const d = parseD(C.date), first = new Date(d.getFullYear(), d.getMonth(), 1), a = addDays(dkey(first), -first.getDay());
      return [a, addDays(a, 41)];
    }
    const calCache = {};
    async function calLoad(a, b, force = false) {
      const k = a + "_" + b, c = calCache[k];
      if (!force && c && (c.loading || Date.now() - c.at < 5 * 60e3)) return;
      calCache[k] = { ...(c || { items: [] }), loading: true, at: c?.at || 0 };
      try { calCache[k] = { at: Date.now(), items: await gList(a, b) }; }
      catch (e) { calCache[k] = { at: Date.now(), items: c?.items || [], err: e?.code || e?.message || "error" }; if (force) gErrToast(e); }

    function calIndex(a, b) {
      const map = {}, push = (d, x) => { if (d >= a && d <= b) (map[d] ||= []).push(x); };
      const items = calCache[a + "_" + b]?.items || [], imported = new Set(state.tasks.filter(t => t.gcalId).map(t => t.gcalId));
      items.forEach(e => {
        if (evIsMine(e) || evDeclined(e) || imported.has(e.id)) return;
        const T = evTimes(e);
        for (let d = T.a < a ? a : T.a, i = 0; d <= T.b && d <= b && i < 62; d = addDays(d, 1), i++) push(d, { k: "g", e, T, d, title: e.summary || L("(ไม่มีชื่อ)", "(no title)"), sort: T.allDay || d !== T.a ? -1 : T.start });
      });
      state.tasks.forEach(t => push(t.date, { k: "t", t, title: t.title, sort: t.start }));
      state.projects.forEach(p => p.steps.forEach(s => {
        if (s.start) push(s.start, { k: "s", p, s, title: "▶ " + s.title, sort: -2 });
        if (s.end && s.end !== s.start) push(s.end, { k: "s", p, s, title: "🏁 " + s.title, sort: -2 });

    function calDayPanel(d, list) {

        <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn btn-sm" data-act="qdateGo" data-v="${d}" id="cq-${d}">📅 ${L("เปิดคิววันนี้", "Open queue")}</button><button class="btn btn-sm" data-act="gcalPull" data-a="${d}" id="cp-${d}">📥 ${L("ดึงเข้าคิว", "Pull to queue")}</button></div></div>
        ${list.length ? `<ul class="cal-list">${list.map(row).join("")}</ul>` : `<p class="empty">${L("ไม่มีนัดหมายหรืองาน", "Nothing scheduled")}</p>`}</article>`;
    }
    function renderCalendar() {

    /* ---------- 🔁 Routines: weekend + MWF + Custom multi-day picker + Planner → routine ---------- */

    /* ---------- 🧾 Thai income tax: personal & company ---------- */

    function depositTripSavings(tid, amount, syncFin = true) {
      const t = (P().trips || []).find(x => x.id === tid);
      const amt = Math.max(0, Number(amount) || 0);
      if (!t || !(amt > 0)) return;
      t.saved = Math.max(0, (Number(t.saved) || 0) + amt);
      if (syncFin) {
        const F = P().finance;
        F.saved = Math.max(0, (Number(F.saved) || 0) + amt);
        (P().txns ||= []).push({
          id: uid(),
          ts: Date.now(),
          date: dkey(),
          type: "exp",
          cat: "invest",
          amount: amt,
          note: `✈️ ${L("ออมเงินทริป", "Trip savings")}: ${t.place || "-"}`
        });
      }
      rerender();
      const s = tripStats(t);
      toast(L(`🐷 ออมเข้าทริป "${t.place}" +${money(amt)} ฿ แล้ว (เก็บได้ ${money(s.saved)}/${money(s.budget)} ฿)`, `🐷 Saved +${money(amt)} ฿ for "${t.place}" (${money(s.saved)}/${money(s.budget)} ฿)`));
    }

          const cfg = CRUD[name];
          const row = (P()[name] || []).find(x => x.id === id);
          if (!cfg || !row) return;
          cfg.fields.forEach(([k, , t]) => {
            let v = fd[k] ?? "";
            if (t === "number") v = v === "" ? 0 : Number(v);
            else v = String(v).trim();
            row[k] = v;
          });
        } else if (kind === "txn") {
          const x = (P().txns || []).find(t => t.id === id);
          const amount = Number(fd.amount);
          if (!x || !(amount > 0)) return;
          x.type = fd.type === "inc" ? "inc" : "exp";
          x.amount = amount;
          x.date = fd.date || x.date || dkey();
          x.cat = fd.cat || "other";
          x.note = (fd.note || "").trim();
        } else if (kind === "act") {
          const [p, s, a] = findAct(f.dataset.pid, f.dataset.sid, f.dataset.aid);
          const title = (fd.title || "").trim();
          if (!a || !title) return;
          a.title = title;
          a.date = fd.date || "";
          if (a.taskId) {
            const t = state.tasks.find(k => k.id === a.taskId);
            if (t) {
              t.title = a.title;
              if (a.date) t.date = a.date;
            }
          }
          autoSync(p, s);
        } else if (kind === "link") {
          const p = proj(f.dataset.pid), l = p?.links?.find(x => x.id === id);
          const url = (fd.url || "").trim();
          if (!l || !/^https?:\/\//i.test(url)) {
            toast(L("ลิงก์ต้องขึ้นต้นด้วย https://", "Link must start with https://"));
            return;
          }
          l.label = (fd.label || "").trim();
          l.url = url;
        } else if (kind === "idea") {
          const x = state.ideas.find(i => i.id === id);
          const text = (fd.text || "").trim();
          if (!x || !text) return;
          x.text = text;
          renderIdeas();
          renderTopbar();
        } else if (kind === "tripStep") {
          const t = (P().trips || []).find(x => x.id === f.dataset.tid);
          const st = (t?.steps || []).find(x => x.id === id);
          const title = (fd.title || "").trim();
          if (!st || !title) return;
          st.title = title;
          st.date = fd.date || "";
          st.note = (fd.note || "").trim();
        } else if (kind === "cgItem") {
          const list = getCgList(f.dataset.sec, f.dataset.key, f.dataset.sub);
          const idx = list.findIndex(x => x.id === id);
          const it = idx >= 0 ? list[idx] : null;
          const text = (fd.text || "").trim();
          if (!it || !text) return;
          it.text = text;
          if (fd.targetGroup !== undefined && (f.dataset.sec === "mfocus" || f.dataset.sec === "mfgrp")) {
            const curGrp = f.dataset.sec === "mfgrp" ? (f.dataset.sub || "") : "";
            const newGrp = fd.targetGroup || "";
            if (curGrp !== newGrp) {
              list.splice(idx, 1);
              const dst = newGrp ? getCgList("mfgrp", f.dataset.key, newGrp) : getCgList("mfocus", f.dataset.key, "");
              dst.push(it);
            }
          }
        } else if (kind === "mfGroup") {
          const mk = f.dataset.key || dkey().slice(0, 7);
          const groups = (P().monthly[mk] ||= { focusItems: [], focusGroups: [] }).focusGroups ||= [];
          const g = groups.find(x => x.id === id);
          const title = (fd.title || "").trim();
          if (!g || !title) return;
          g.title = title;
        }
        $("#edit-item-dlg")?.close();
        rerender();
        toast(L("✏️ บันทึกการแก้ไขเรียบร้อยแล้ว", "✏️ Changes saved"));
      },
      mfAddGroup: (fd, f) => {
        const title = (fd.title || "").trim();
        if (!title) return;
        const mk = f.dataset.mk || dkey().slice(0, 7);
        const M = (P().monthly[mk] ||= { focusItems: [], focusGroups: [] });
        M.focusGroups ||= [];
        M.focusGroups.push({ id: uid(), title, items: [] });
        rerender();
        toast(L(`📁 สร้างหัวข้อ "${title}" แล้ว — ลากรายการเข้ามาวางหรือพิมพ์เพิ่มได้เลย`, `📁 Topic "${title}" created`));
      },
      cgAdd: (fd, f) => {
        const text = (fd.text || "").trim();
        if (!text) return;
        const sec = f.dataset.sec || "";
        const key = f.dataset.key || "";
        const sub = f.dataset.sub || "";
        const list = getCgList(sec, key, sub);
        text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
          list.push({ id: uid(), text: line, done: false });
        });
        rerender();
        toast(L("＋ เพิ่มรายการแล้ว", "＋ Item added"));
      },
      tripSave: (fd, f) => {
        const amt = Number(fd.amount);
        if (!(amt > 0)) { toast(L("กรุณาใส่จำนวนเงินมากกว่า 0", "Enter an amount above 0")); return; }
        depositTripSavings(f.dataset.id, amt, !!fd.syncFin);
      },
      addTripStep: (fd, f) => {
        const t = (P().trips || []).find(x => x.id === f.dataset.tid);
        const title = (fd.title || "").trim();
        if (!t || !title) return;
        (t.steps ||= []).push({
          id: uid(),
          title,
          done: false,
          date: fd.date || "",
          note: (fd.note || "").trim()
        });
        rerender();
        toast(L("🧭 เพิ่มขั้นตอนเตรียมทริปแล้ว", "🧭 Added trip checklist step"));
      },
      addRoutine: fd => { const r = makeRoutine(fd); if (!r) return; rerender(); routineToast(r); },
      toRoutine: fd => { const r = makeRoutine(fd); if (!r) return; $("#routine-dlg").close(); rerender(); routineToast(r); },
      addMonthIncome: fd => {
        const amount = Number(fd.amount); if (!(amount > 0)) { toast(L("ใส่จำนวนเงินมากกว่า 0", "Enter an amount above 0")); return; }
        const cat = fd.cat || "salary";
        const note = (fd.note || "").trim() || (ICAT()[cat] || ICAT().other)[1];
        (P().txns ||= []).push({ id: uid(), ts: Date.now(), date: fd.date || dkey(), type: "inc", cat, amount, note });
        rerender();
        toast(L(`➕ บันทึกรายรับ "${note}" ${money(amount)} ฿ แล้ว`, `➕ Income "${note}" ${money(amount)} ฿ saved`));
        setTimeout(() => $("#minc-note")?.focus(), 40);
      },
      driveSearch: fd => {
        driveBrowser.q = (fd.q || "").trim();
        loadDriveFiles(false);
      },
      addTxn: fd => {
        const amount = Number(fd.amount); if (!(amount > 0)) { toast(L("ใส่จำนวนเงินมากกว่า 0", "Enter an amount above 0")); return; }
        const type = fd.type === "inc" ? "inc" : "exp";
        (P().txns ||= []).push({ id: uid(), ts: Date.now(), date: fd.date || dkey(), type, cat: fd.cat || "other", amount, note: (fd.note || "").trim() });
        finView().kind = type; rerender();
        toast(type === "inc" ? L(`➕ บันทึกรายรับ ${money(amount)} ฿ แล้ว`, `➕ Income ${money(amount)} ฿ saved`) : L(`➖ บันทึกรายจ่าย ${money(amount)} ฿ แล้ว`, `➖ Expense ${money(amount)} ฿ saved`));
        setTimeout(() => $("#txn-amount")?.focus(), 40);
      },
      userSearch: fd => {
        adminUsersState.q = (fd.q || "").trim();
        renderUsers();
      },
      adminSaveUser: async (fd, f) => {
        const uidKey = f.dataset.uid;
        const raw = adminUsersState.users.find(x => x.uid === uidKey);
        if (!raw) return;
        const st = fd.status || "trial";
        const isAdm = st === "admin" || fd.plan === "lifetime_admin";
        const subStatus = isAdm ? "pro" : (st === "pro" ? "pro" : st === "canceled" ? "canceled" : "trial");
        const plan = isAdm ? "lifetime_admin" : (fd.plan || (subStatus === "pro" ? "promptpay_30d" : "trial"));
        const proMonths = Math.max(0, Number(fd.pro_months) || 0);
        const untilStr = (fd.pro_until || "").trim();
        const proUntilDate = untilStr ? new Date(untilStr + "T23:59:59") : null;
        const patch = {
          subscription_status: subStatus,
          plan,
          is_admin: isAdm,
          pro_months: proMonths,
          pro_until: isAdm ? null : proUntilDate,
          admin_note: (fd.admin_note || "").trim(),
          granted_by: state.user?.email || "admin",
          updated_at: fb?.serverTimestamp ? fb.serverTimestamp() : new Date()
        };
        if (subStatus === "pro" && !raw.pro_since) patch.pro_since = new Date();
        try {
          if (fb?.setDoc && fb?.doc) {
            await fb.setDoc(fb.doc(fb.db, "users", uidKey), patch, { merge: true });
          }
          Object.assign(raw, patch, { updated_at: Date.now() });
          $("#user-edit-dlg")?.close();
          renderUsers();
          toast(L(`💾 บันทึกข้อมูลผู้ใช้ ${raw.name || raw.email} เรียบร้อยแล้ว`, `💾 Saved user ${raw.name || raw.email}`));
        } catch (e) {
          console.error(e);
          toast(L("บันทึกไม่สำเร็จ: ", "Save failed: ") + (e.message || e));
        }
      }
    });

    /* ===================== Event delegation ===================== */
    document.addEventListener("click", e => {
      const el = e.target.closest("[data-act]"); if (!el) return;
      ensureAudio();
      const fn = A[el.dataset.act]; if (!fn) return;
      e.preventDefault(); fn(el.dataset, el);
    });
    document.addEventListener("input", e => {
      const el = e.target.closest("[data-bind]"); if (!el) return;
      let v = el.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.num || el.type === "number" || el.type === "range") v = v === "" ? 0 : Number(v);
      setPath(state, el.dataset.bind, v); save();
      if (el.dataset.live === "tiny") $("#tiny-formula").innerHTML = tinyText();
      else if (el.dataset.live && LIVE[el.dataset.live]) LIVE[el.dataset.live]();
    });
    document.addEventListener("change", e => {
      const el = e.target;
      if (el.dataset.actChange === "plannerDate") { state.plannerDate = el.value || dkey(); renderView(); return; }
      if (el.dataset.actChange && CHANGE[el.dataset.actChange]) { CHANGE[el.dataset.actChange](el); return; }
      if (el.dataset.bind === "alerts.notify" && el.checked && "Notification" in window) {
        Notification.requestPermission().then(p => { if (p !== "granted") { state.alerts.notify = false; el.checked = false; save(); toast(L("เบราว์เซอร์ไม่อนุญาตการแจ้งเตือน", "Notifications were blocked by the browser")); } else toast(L("🔔 เปิดแจ้งเตือนเบราว์เซอร์แล้ว", "🔔 Browser notifications on")); });
      }
      if (el.dataset.rr) renderView();
    });
    document.addEventListener("submit", e => {
      const f = e.target; e.preventDefault();
      const fd = Object.fromEntries(new FormData(f));
      if (f.dataset.crud) addCrud(f.dataset.crud, fd);
      else if (f.dataset.form) FORMS[f.dataset.form]?.(fd, f);
    });
    $("#paywall").addEventListener("cancel", e => e.preventDefault()); // Paywall cannot be dismissed with Esc / back gesture
    document.addEventListener("keydown", e => {
      if (e.key === "/" && !e.target.closest("input,textarea,select") && state.user) { e.preventDefault(); $("#idea-input").focus(); }
    });

    /* ===================== Auth & boot ===================== */
    function showAuth() { $("#app").hidden = true; $("#auth-screen").hidden = false; if ($("#paywall").open) $("#paywall").close(); }
    function showApp() { $("#auth-screen").hidden = true; $("#app").hidden = false; seed(); renderAll(); }
    async function login() {
      if (fb) {
        try {
          const prov = new fb.GoogleAuthProvider(), all = Object.values(G_SCOPES);
          all.forEach(s => prov.addScope(s));
          const res = await fb.signInWithPopup(fb.auth, prov);
          const cred = fb.GoogleAuthProvider.credentialFromResult?.(res);
          if (cred?.accessToken) saveGTok(cred.accessToken, all);
        }
        catch (e) {
          console.error(e);
          if (e.code === "auth/unauthorized-domain") {
            toast(L(`โดเมน ${location.hostname} ยังไม่ได้รับอนุญาตใน Firebase (เพิ่มใน Authorized domains)`, `Domain ${location.hostname} not authorized in Firebase Console`));
          } else {
            toast(L("เข้าสู่ระบบไม่สำเร็จ: ", "Sign-in failed: ") + (e.code || e.message));
          }
        }
      } else $("#demo-dlg").showModal();
    }
    async function logout() {
      if (!confirm(L("ออกจากระบบ? (ข้อมูลยังเก็บไว้ในบัญชีของคุณ)", "Sign out? (your data stays in your account)"))) return;
      ["account-dlg", "paywall", "pay-dlg"].forEach(id => $("#" + id).open && $("#" + id).close());
      if (fb) await fb.signOut(fb.auth);
      else { state.user = null; save(); showAuth(); }
    }
    async function initFirebase() {
      const [app, auth, fs] = await Promise.all([
        import(`${FIREBASE_SDK}/firebase-app.js`), import(`${FIREBASE_SDK}/firebase-auth.js`), import(`${FIREBASE_SDK}/firebase-firestore.js`)
      ]);
      const a = app.initializeApp(FIREBASE_CONFIG);
      fb = {
        auth: auth.getAuth(a), db: fs.getFirestore(a), GoogleAuthProvider: auth.GoogleAuthProvider, signInWithPopup: auth.signInWithPopup, signOut: auth.signOut, reauthenticateWithPopup: auth.reauthenticateWithPopup,
        doc: fs.doc, getDoc: fs.getDoc, setDoc: fs.setDoc, updateDoc: fs.updateDoc, collection: fs.collection, getDocs: fs.getDocs, onSnapshot: fs.onSnapshot, serverTimestamp: fs.serverTimestamp
      };
      let unsub = null;
      auth.onAuthStateChanged(fb.auth, async u => {
        unsub?.(); unsub = null;
        if (!u) { state.user = null; save(); showAuth(); return; }
        const switched = state.user?.uid !== u.uid;
        state.user = { uid: u.uid, name: u.displayName || u.email, email: u.email, photo: u.photoURL || "" };
        const uref = fb.doc(fb.db, "users", u.uid);
        try {
          const snap = await fb.getDoc(uref);
          if (!snap.exists()) {
            // First Google sign-in → start 7-day trial
            await fb.setDoc(uref, {
              email: (u.email || "").toLowerCase(),
              name: u.displayName || "",
              photo: u.photoURL || "",
              auth_provider: "google.com",
              trial_start_at: fb.serverTimestamp(),
              subscription_status: "trial",
              created_at: fb.serverTimestamp(),
              last_login_at: fb.serverTimestamp(),
              login_count: 1
            });
            state.sub = { subscription_status: "trial", trial_start_at: Date.now(), pro_pending_at: state.sub.pro_pending_at, pro_until: state.sub.pro_until };
            track("CompleteRegistration"); track("StartTrial", { value: 0, currency: "THB" });
          } else {
            const prev = snap.data() || {};
            fb.setDoc(uref, {
              email: (u.email || prev.email || "").toLowerCase(),
              name: u.displayName || prev.name || "",
              photo: u.photoURL || prev.photo || "",
              auth_provider: "google.com",
              last_login_at: fb.serverTimestamp(),
              login_count: (Number(prev.login_count) || 1) + 1
            }, { merge: true }).catch(() => {});
          }
          if (ADMIN_EMAILS.some(e => e.toLowerCase() === (u.email || "").toLowerCase())) {
            grantAdminLifetime(false);
          }
          unsub = fb.onSnapshot(uref, s => s.exists() && applyServerSub(s.data()));
          const ds = await fb.getDoc(fb.doc(fb.db, "users", u.uid, "data", "main"));
          if (ds.exists()) { const keep = { user: state.user, sub: state.sub, lang: state.lang }; state = hydrate({ ...JSON.parse(ds.data().payload || "{}"), ...keep }); state.queueDate = dkey(); state.plannerDate = dkey(); }
          else { if (switched) { const keep = { user: state.user, sub: state.sub, theme: state.theme, lang: state.lang }; state = hydrate(keep); state.queueDate = dkey(); state.plannerDate = dkey(); } seed(); cloudSave(); }
        } catch (e) { console.error(e); toast(L("โหลดข้อมูลจากคลาวด์ไม่สำเร็จ — ใช้ข้อมูลในเครื่องชั่วคราว", "Couldn't load cloud data — using local data for now")); }
        LANG = state.lang; save(); renderStatic(); showApp();
      });
    }

    /* ---------- Ticker ---------- */
    let tick = 0;
    setInterval(() => {
      if (!state.user || $("#app").hidden) return;
      tick++;
      if (state.tab === "focus") {
        const key = cockpitKey();
        if (key !== lastCockpitKey && !document.activeElement?.closest?.("#view-focus input, #view-focus textarea, #view-focus select")) renderView();
        else tickCockpit();
      }
      if (tick % 15 === 0) checkAlerts();
      if (tick % 30 === 0) { renderBanner(); checkPaywall(); }
    }, 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && state.user) { renderBanner(); checkPaywall(); checkAlerts(); if (state.tab === "focus") renderView(); } });

    /* ---------- Boot ---------- */
    applyTheme();
    loadPixel();
    if (location.hash.startsWith("#share=")) {
      renderShare();
    } else {
      renderStatic();
      handleStripeReturn();
      checkAdminUrl();
      if (FIREBASE_READY) {
        try { await initFirebase(); }
        catch (e) { console.error(e); fb = null; toast(L("เชื่อมต่อ Firebase ไม่สำเร็จ — ใช้โหมดสาธิต", "Firebase connection failed — using demo mode")); state.user ? showApp() : showAuth(); }
      } else state.user ? showApp() : showAuth();
    }
  </script>
</body>

</html>
