<!doctype html>
<html lang="th" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlowRecover x Life Planner — Adaptive Time-Blocking & Life Planner OS</title>
  <meta name="description"
    content="FlowRecover x Life Planner: จัดตารางงานยืดหยุ่น กู้คืนงานเมื่อถูกขัดจังหวะ เลื่อนคิวอัตโนมัติ บริหารโปรเจค และสมุดวางแผนชีวิตครบวงจร ใช้งานง่ายด้วยมือเดียวบนมือถือ">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlowRecover">
  <meta name="application-name" content="FlowRecover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e222d;
      --surface-2: #262c3a;
      --surface-3: #303748;
      --border: rgba(148, 163, 184, .14);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --amber-2: #fbbf24;
      --emerald: #10b981;
      --emerald-2: #34d399;
      --rose: #f43f5e;
      --sky: #38bdf8;
      --violet: #a78bfa;
      --pink: #f472b6;
      --shadow: 0 14px 34px -16px rgba(0, 0, 0, .65);
      --radius: 20px;
      --nav-h: 70px;
      --glass: rgba(15, 23, 42, .74);
      --side-w: 236px;
    }

    [data-theme=light] {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --surface-2: #f1f4f9;
      --surface-3: #e5eaf2;
      --border: rgba(15, 23, 42, .09);
      --text: #0f172a;
      --muted: #5b6b82;
      --shadow: 0 12px 30px -16px rgba(15, 23, 42, .25);
      --glass: rgba(255, 255, 255, .8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    [hidden] {
      display: none !important
    }

    html {
      -webkit-text-size-adjust: 100%;
      color-scheme: dark
    }

    [data-theme=light] {
      color-scheme: light
    }

    body {
      font-family: 'IBM Plex Sans Thai', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.55;
      -webkit-tap-highlight-color: transparent;
      background-image: radial-gradient(900px 520px at 105% -10%, rgba(245, 158, 11, .11), transparent 60%), radial-gradient(800px 520px at -10% 110%, rgba(16, 185, 129, .11), transparent 60%);
      background-attachment: fixed
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer
    }

    input,
    textarea,
    select {
      font: inherit;
      color: inherit
    }

    a {
      color: var(--amber)
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.25;
      letter-spacing: -.01em
    }

    .mono {
      font-family: 'Inter', sans-serif;
      font-variant-numeric: tabular-nums
    }

    .muted {
      color: var(--muted)
    }

    .center {
      text-align: center
    }

    .sm {
      font-size: .86rem
    }

    .grow {
      flex: 1
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .stack {
      display: grid;
      gap: 12px
    }

    .amber {
      color: var(--amber)
    }

    .emerald {
      color: var(--emerald)
    }

    .rose {
      color: var(--rose)
    }

    /* ---------- Buttons & inputs ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: transform .15s, box-shadow .2s, background .2s, filter .2s;
      white-space: nowrap
    }

    .btn:hover {
      filter: brightness(1.08)
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--amber-2), var(--amber) 55%, #d97706);
      color: #1b1205;
      border: 0;
      box-shadow: 0 10px 24px -10px rgba(245, 158, 11, .75)
    }

    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald-2), var(--emerald) 55%, #059669);
      color: #04150f;
      border: 0;
      box-shadow: 0 10px 24px -10px rgba(16, 185, 129, .75)
    }

    .btn-rose {
      background: linear-gradient(135deg, #fb7185, var(--rose));
      color: #fff;
      border: 0
    }

    .btn-ghost {
      background: transparent
    }

    .btn-sm {
      min-height: 34px;
      padding: 6px 12px;
      font-size: .85rem;
      border-radius: 10px
    }

    .btn-xl {
      width: 100%;
      min-height: 68px;
      font-size: 1.25rem;
      border-radius: 18px;
      font-weight: 700
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-grid;
      place-items: center;
      font-size: 1.05rem;
      transition: background .2s
    }

    .icon-btn:hover {
      background: var(--surface-3)
    }

    .link {
      color: var(--amber);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      outline: none;
      transition: border .2s, box-shadow .2s
    }

    .input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, .15)
    }

    textarea.input {
      resize: vertical;
      min-height: 72px
    }

    .field {
      display: grid;
      gap: 6px
    }

    .field>span {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500
    }

    .field.sm>span {
      font-size: .78rem
    }

    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border)
    }

    .switch input {
      appearance: none;
      width: 48px;
      height: 28px;
      border-radius: 99px;
      background: var(--surface-3);
      position: relative;
      cursor: pointer;
      transition: background .2s;
      flex: none
    }

    .switch input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3)
    }

    .switch input:checked {
      background: var(--emerald)
    }

    .switch input:checked::after {
      transform: translateX(20px)
    }

    /* ---------- Chips & pills ---------- */
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: .76rem;
      font-weight: 600;
      background: var(--surface-3);
      color: var(--muted)
    }

    .chip-amber {
      background: rgba(245, 158, 11, .16);
      color: var(--amber)
    }

    .chip-emerald {
      background: rgba(16, 185, 129, .16);
      color: var(--emerald)
    }

    .chip-rose {
      background: rgba(244, 63, 94, .16);
      color: var(--rose)
    }

    .chip-sky {
      background: rgba(56, 189, 248, .16);
      color: var(--sky)
    }

    .chip-violet {
      background: rgba(167, 139, 250, .16);
      color: var(--violet)
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: .82rem;
      font-weight: 700;
      background: var(--surface-3)
    }

    .pill-amber {
      background: rgba(245, 158, 11, .15);
      color: var(--amber)
    }

    .pill-rose {
      background: rgba(244, 63, 94, .15);
      color: var(--rose)
    }

    .pill-emerald {
      background: rgba(16, 185, 129, .15);
      color: var(--emerald)
    }

    .pill-sky {
      background: rgba(56, 189, 248, .15);
      color: var(--sky)
    }

    .seg {
      display: flex;
      gap: 6px;
      padding: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .seg::-webkit-scrollbar {
      display: none
    }

    .seg button {
      flex: 1;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      transition: all .2s
    }

    .seg button.on {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow)
    }

    /* ---------- Layout ---------- */
    .app-shell {
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)
    }

    .topwrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top)
    }

    .banner {
      display: block;
      padding: 8px 14px 6px;
      font-size: .84rem
    }

    .banner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .banner.pro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, rgba(16, 185, 129, .18), transparent);
      color: var(--emerald)
    }

    .banner.expired {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(244, 63, 94, .14);
      color: var(--rose)
    }

    .banner.trial.urgent .banner-text b {
      color: var(--rose)
    }

    .trial-bar {
      height: 5px;
      border-radius: 9px;
      background: var(--surface-3);
      margin-top: 6px;
      overflow: hidden
    }

    .trial-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--amber));
      border-radius: 9px;
      transition: width .6s
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-family: 'Inter';
      white-space: nowrap
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #1b1845;
      color: #0b1220;
      font-size: 1.05rem;
      box-shadow: 0 6px 18px -6px rgba(245, 158, 11, .55);
      border: 1.5px solid rgba(251, 191, 36, .35)
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .brand-word {
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 45%, #34d399 55%, #10b981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .brand-text {
      display: none
    }

    .idea-box {
      flex: 1;
      position: relative
    }

    .idea-box .input {
      min-height: 40px;
      padding-left: 38px;
      border-radius: 99px;
      font-size: .92rem
    }

    .idea-box::before {
      content: "💡";
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .95rem
    }

    .badge-btn {
      position: relative
    }

    .badge-btn b {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--amber);
      color: #111;
      font-size: .68rem;
      display: grid;
      place-items: center;
      padding: 0 4px
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet), var(--sky));
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      flex: none
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 14px
    }

    .view {
      animation: fadeUp .35s ease both
    }

    .view-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .view-head h1 {
      font-size: 1.45rem
    }

    .view-head p {
      color: var(--muted);
      font-size: .9rem
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px
    }

    .card-head h3 {
      margin: 0
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px;
      font-size: .9rem;
      border: 1px dashed var(--border);
      border-radius: 14px
    }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding: 6px 6px env(safe-area-inset-bottom);
      display: flex;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-top: 1px solid var(--border)
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 16px;
      font-size: .7rem;
      font-weight: 600;
      color: var(--muted);
      position: relative;
      transition: color .2s
    }

    .nav-btn .ico {
      font-size: 1.35rem;
      line-height: 1;
      transition: transform .25s
    }

    .nav-btn.on {
      color: var(--amber)
    }

    .nav-btn.on .ico {
      transform: translateY(-2px) scale(1.12)
    }

    .nav-btn.on::before {
      content: "";
      position: absolute;
      inset: 4px 10%;
      border-radius: 14px;
      background: rgba(245, 158, 11, .12);
      z-index: -1
    }

    .side-brand {
      display: none
    }

    /* ---------- Focus cockpit ---------- */
    .cockpit {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 14px;
      border: 1px solid rgba(245, 158, 11, .35);
      background: radial-gradient(500px 220px at 100% 0, rgba(245, 158, 11, .14), transparent 70%), var(--surface)
    }

    .cockpit.interrupting {
      border-color: rgba(244, 63, 94, .5);
      background: radial-gradient(500px 240px at 100% 0, rgba(244, 63, 94, .18), transparent 70%), var(--surface)
    }

    .cockpit.idle {
      border-color: var(--border)
    }

    .cockpit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .cockpit-title {
      font-size: 1.5rem
    }

    .big-timer {
      font-family: 'Inter';
      font-weight: 800;
      font-size: clamp(3rem, 13vw, 4.6rem);
      letter-spacing: -.03em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      background: linear-gradient(180deg, var(--text), var(--muted));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .big-timer.warn {
      background: linear-gradient(180deg, var(--amber-2), var(--rose));
      -webkit-background-clip: text;
      background-clip: text
    }

    .interrupting .big-timer {
      background: linear-gradient(180deg, #fda4af, var(--rose));
      -webkit-background-clip: text;
      background-clip: text
    }

    .bar {
      height: 10px;
      border-radius: 9px;
      background: var(--surface-3);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--emerald), var(--amber));
      transition: width .8s
    }

    .interrupt-btn {
      animation: glow 2.6s ease-in-out infinite
    }

    .rest-btn {
      background: linear-gradient(135deg, #059669, #10b981) !important;
      color: #fff !important;
      box-shadow: 0 10px 24px -8px rgba(16, 185, 129, .5);
      border: 1px solid rgba(52, 211, 153, .4) !important;
    }

    .rest-btn:hover {
      box-shadow: 0 14px 28px -6px rgba(16, 185, 129, .65);
      transform: translateY(-1px);
    }

    .cockpit.resting {
      border: 1px solid rgba(16, 185, 129, .45);
      background: radial-gradient(700px 300px at 0 0, rgba(16, 185, 129, .15), transparent 70%),
                  radial-gradient(600px 300px at 100% 100%, rgba(56, 189, 248, .12), transparent 70%),
                  var(--surface);
    }

    .cockpit.sleeping {
      border: 1px solid rgba(129, 140, 248, .45);
      background: radial-gradient(700px 300px at 0 0, rgba(99, 102, 241, .25), transparent 70%),
                  radial-gradient(600px 300px at 100% 100%, rgba(168, 85, 247, .2), transparent 70%),
                  #0b1021;
      color: #e0e7ff;
      box-shadow: 0 16px 40px -12px rgba(15, 23, 42, .85);
    }

    .btn-indigo {
      background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
      color: #fff !important;
      box-shadow: 0 10px 24px -8px rgba(99, 102, 241, .5);
      border: 1px solid rgba(129, 140, 248, .4) !important;
    }

    .btn-indigo:hover {
      box-shadow: 0 14px 28px -6px rgba(99, 102, 241, .65);
      transform: translateY(-1px);
    }

    .pill-indigo {
      background: rgba(99, 102, 241, .2);
      color: #c7d2fe;
      border: 1px solid rgba(129, 140, 248, .35);
    }

    .chip-indigo {
      background: rgba(99, 102, 241, .2);
      color: #c7d2fe;
      border: 1px solid rgba(129, 140, 248, .35);
    }

    .big-timer.indigo {
      color: #a5b4fc;
      text-shadow: 0 0 25px rgba(129, 140, 248, .45);
    }

    .task.rest-task {
      border-left: 3px solid var(--emerald);
    }

    .task.sleep-task {
      border-left: 3px solid #818cf8;
      background: rgba(99, 102, 241, .06);
    }

    .night-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, .14), rgba(168, 85, 247, .1));
      border: 1px solid rgba(129, 140, 248, .35);
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .bookmark-note {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(56, 189, 248, .1);
      border: 1px solid rgba(56, 189, 248, .25);
      font-size: .9rem
    }

    .bookmark-note.sm {
      font-size: .8rem;
      padding: 6px 10px;
      margin-top: 6px
    }

    .paused-task {
      padding: 12px;
      border-radius: 14px;
      background: var(--surface-2);
      font-size: .92rem
    }

    .pulse-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }

    .stat {
      padding: 14px 10px;
      border-radius: 16px;
      background: var(--surface-2);
      text-align: center
    }

    .stat b {
      display: block;
      font-family: 'Inter';
      font-size: 1.5rem;
      font-weight: 800
    }

    .stat span {
      font-size: .75rem;
      color: var(--muted)
    }

    .reflow {
      border-color: rgba(16, 185, 129, .4);
      background: linear-gradient(135deg, rgba(16, 185, 129, .12), transparent 60%), var(--surface)
    }

    .warn-box {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(244, 63, 94, .12);
      color: var(--rose);
      font-size: .88rem;
      margin: 8px 0
    }

    /* ---------- Tasks ---------- */
    .tasks {
      list-style: none;
      display: grid;
      gap: 8px
    }

    .task {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid transparent;
      transition: border .2s, opacity .2s
    }

    .task.live {
      border-color: rgba(245, 158, 11, .55);
      background: linear-gradient(90deg, rgba(245, 158, 11, .1), var(--surface-2))
    }

    .task.done {
      opacity: .55
    }

    .task.done .task-title {
      text-decoration: line-through
    }

    .check {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 2px solid var(--muted);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #04150f;
      transition: all .2s;
      margin-top: 2px
    }

    .task.done .check,
    .check.on {
      background: var(--emerald);
      border-color: var(--emerald)
    }

    .task-main {
      flex: 1;
      min-width: 0
    }

    .task-time {
      font-size: .8rem;
      color: var(--amber);
      font-weight: 600
    }

    .task-title {
      font-weight: 600;
      margin: 2px 0 6px;
      word-break: break-word
    }

    .task-actions {
      display: flex;
      gap: 2px
    }

    .form-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr
    }

    .form-grid .full {
      grid-column: 1/-1
    }

    .streak {
      font-family: 'Inter';
      font-weight: 800;
      color: var(--amber)
    }

    /* ---------- Projects ---------- */
    .proj {
      padding: 0;
      overflow: hidden
    }

    .proj-head {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px;
      cursor: pointer;
      width: 100%;
      text-align: left
    }

    .proj-head:hover {
      background: var(--surface-2)
    }

    .ring {
      --p: 0;
      width: 54px;
      height: 54px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--emerald) calc(var(--p)*1%), var(--surface-3) 0);
      font-family: 'Inter';
      font-weight: 800;
      font-size: .8rem
    }

    .ring::before {
      content: "";
      position: absolute
    }

    .ring span {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center
    }

    .proj-body {
      padding: 0 16px 16px;
      display: grid;
      gap: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px
    }

    .steps {
      list-style: none;
      position: relative;
      display: grid;
      gap: 8px;
      padding-left: 18px
    }

    .steps::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--surface-3)
    }

    .step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--surface-2)
    }

    .step::before {
      content: "";
      position: absolute;
      left: -17px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sc, var(--muted));
      box-shadow: 0 0 0 3px var(--surface)
    }

    .step .grow {
      word-break: break-word
    }

    .st-btn {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: .74rem;
      font-weight: 700;
      background: color-mix(in srgb, var(--sc) 18%, transparent);
      color: var(--sc);
      min-width: 72px
    }

    .links {
      list-style: none;
      display: grid;
      gap: 6px
    }

    .links li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--surface-2)
    }

    .links a {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
      font-weight: 600
    }

    .map-wrap {
      overflow-x: auto;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border)
    }

    .map-wrap svg {
      display: block;
      min-width: 820px;
      width: 100%;
      height: auto
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: .8rem;
      color: var(--muted);
      margin-top: 10px
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px;
      vertical-align: middle
    }

    /* ---------- Planner ---------- */
    .planner-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .shortcuts {
      display: flex;
      gap: 6px
    }

    .shortcuts button {
      width: 52px;
      height: 44px;
      border-radius: 14px;
      font-family: 'Inter';
      font-weight: 800;
      font-size: .85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all .2s
    }

    .shortcuts button.on {
      background: linear-gradient(135deg, var(--amber), #d97706);
      color: #160f02;
      border-color: transparent;
      box-shadow: 0 8px 20px -10px rgba(245, 158, 11, .8)
    }

    .sec-title {
      font-size: 1.15rem;
      margin: 4px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dims {
      display: grid;
      gap: 10px
    }

    .dim {
      padding: 14px;
      border-radius: 16px;
      background: var(--surface-2);
      border-left: 4px solid var(--dc);
      display: grid;
      gap: 8px
    }

    .dim-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .dim-head b {
      font-size: .95rem
    }

    .dim-head small {
      color: var(--muted);
      display: block;
      font-size: .75rem
    }

    .stars {
      display: inline-flex;
      gap: 2px
    }

    .stars button {
      font-size: 1.3rem;
      line-height: 1;
      padding: 2px;
      filter: grayscale(1) opacity(.35);
      transition: transform .15s, filter .15s
    }

    .stars button.on {
      filter: none
    }

    .stars button:hover {
      transform: scale(1.2)
    }

    .hours {
      display: grid;
      gap: 6px
    }

    .hour {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 8px
    }

    .hour b {
      font-family: 'Inter';
      font-size: .82rem;
      color: var(--amber);
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      background: var(--surface-2)
    }

    .hour .input {
      min-height: 40px
    }

    .dream {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .dream-tile {
      border-radius: 18px;
      padding: 14px;
      display: grid;
      gap: 8px;
      color: #fff;
      min-height: 150px
    }

    .dream-tile b {
      font-family: 'Inter';
      font-size: 1rem
    }

    .dream-tile small {
      opacity: .85
    }

    .dream-tile textarea {
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .22);
      color: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      min-height: 70px;
      resize: vertical;
      outline: none
    }

    .dream-tile textarea::placeholder {
      color: rgba(255, 255, 255, .7)
    }

    .mountain {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 10px 0 4px
    }

    .mt-row {
      width: var(--w);
      min-width: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      font-family: 'Inter';
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      position: relative;
      transition: all .3s
    }

    .mt-row.on {
      background: linear-gradient(90deg, rgba(16, 185, 129, .35), rgba(16, 185, 129, .18));
      color: var(--text)
    }

    .mt-row.cur {
      background: linear-gradient(90deg, var(--amber), #d97706);
      color: #140d02;
      box-shadow: 0 8px 22px -10px rgba(245, 158, 11, .9)
    }

    .mt-row em {
      position: absolute;
      right: -30px;
      font-style: normal;
      font-size: 1.3rem;
      animation: bob 1.6s ease-in-out infinite
    }

    .habit-grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      font-size: .82rem
    }

    .habit-grid th {
      color: var(--muted);
      font-weight: 600;
      font-size: .74rem
    }

    .habit-grid td:first-child {
      text-align: left;
      font-weight: 600;
      padding-right: 6px;
      word-break: break-word
    }

    .hcell {
      width: 100%;
      aspect-ratio: 1;
      max-width: 40px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: .9rem;
      transition: all .2s;
      margin: auto
    }

    .hcell.on {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #04150f;
      transform: scale(1.04)
    }

    .hcell.today {
      outline: 2px solid var(--amber);
      outline-offset: 1px
    }

    .moods {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .mood-btn {
      display: grid;
      justify-items: center;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      min-width: 62px;
      font-size: .72rem;
      color: var(--muted);
      transition: all .2s
    }

    .mood-btn span {
      font-size: 1.6rem
    }

    .mood-btn.on {
      border-color: var(--amber);
      background: rgba(245, 158, 11, .14);
      color: var(--text);
      transform: translateY(-2px)
    }

    .mood-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px
    }

    .mood-strip div {
      text-align: center;
      padding: 8px 0;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 1.3rem
    }

    .mood-strip small {
      display: block;
      font-size: .68rem;
      color: var(--muted)
    }

    .money {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .money .stat b {
      font-size: 1.15rem
    }

    .crud-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      align-items: end;
      margin-bottom: 12px
    }

    .rows {
      list-style: none;
      display: grid;
      gap: 6px
    }

    .row-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: .88rem
    }

    .row-item>div {
      flex: 1;
      min-width: 0;
      word-break: break-word
    }

    .sum {
      font-family: 'Inter';
      font-weight: 800;
      color: var(--amber)
    }

    .tiny-formula {
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(167, 139, 250, .16), rgba(56, 189, 248, .1));
      font-size: .95rem
    }

    /* ---------- Guide ---------- */
    .toc {
      list-style: none;
      display: grid;
      gap: 8px
    }

    .toc button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      text-align: left;
      font-weight: 600;
      transition: all .2s
    }

    .toc button .n {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--surface-3);
      font-family: 'Inter';
      font-size: .85rem
    }

    .toc button.on {
      border-color: var(--amber);
      background: rgba(245, 158, 11, .1)
    }

    .toc button.on .n {
      background: var(--amber);
      color: #160f02
    }

    .gsteps {
      list-style: none;
      display: grid;
      gap: 12px;
      counter-reset: s
    }

    .gsteps li {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: start
    }

    .gsteps li::before {
      counter-increment: s;
      content: counter(s);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--amber), var(--emerald));
      color: #0b1220;
      font-family: 'Inter';
      font-weight: 800
    }

    .gsteps b {
      display: block;
      margin-bottom: 2px
    }

    .gsteps p {
      color: var(--muted);
      font-size: .9rem
    }

    /* ---------- Auth screen ---------- */
    .auth {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 18px
    }

    .auth-card {
      width: min(480px, 100%);
      display: grid;
      gap: 20px;
      text-align: center
    }

    .auth-logo {
      width: 112px;
      height: 112px;
      margin: 0 auto;
      border-radius: 28px;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 2.6rem;
      background: #1b1845;
      border: 2px solid rgba(251, 191, 36, .4);
      box-shadow: 0 20px 50px -12px rgba(245, 158, 11, .65);
      animation: float 4s ease-in-out infinite
    }

    .auth-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .auth h1 {
      font-size: clamp(1.7rem, 6vw, 2.3rem);
      font-family: 'Inter', 'IBM Plex Sans Thai';
      font-weight: 800
    }

    .auth h1 span {
      background: linear-gradient(90deg, var(--amber), var(--emerald));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .feat {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left
    }

    .feat div {
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: .82rem
    }

    .feat b {
      display: block;
      font-size: .9rem;
      margin-bottom: 2px
    }

    .gbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      border-radius: 16px;
      background: #fff;
      color: #1f2937;
      font-weight: 700;
      font-size: 1.02rem;
      box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .6);
      transition: transform .15s
    }

    .gbtn:active {
      transform: scale(.98)
    }

    .gbtn svg {
      width: 22px;
      height: 22px
    }

    /* ---------- Dialogs ---------- */
    dialog {
      margin: auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 24px;
      padding: 0;
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100dvh - 32px);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .75)
    }

    dialog:modal {
      overscroll-behavior: contain
    }

    dialog::backdrop {
      background: rgba(2, 6, 23, .72);
      backdrop-filter: blur(6px);
      overflow: hidden;
      overscroll-behavior: contain
    }

    dialog[open] {
      animation: pop .28s ease both
    }

    .dlg-body {
      padding: 22px;
      display: grid;
      gap: 14px
    }

    .dlg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .paywall-hero {
      text-align: center;
      display: grid;
      gap: 10px
    }

    .lock {
      width: 76px;
      height: 76px;
      margin: 0 auto;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      background: linear-gradient(135deg, rgba(245, 158, 11, .25), rgba(244, 63, 94, .2));
      border: 1px solid rgba(245, 158, 11, .4)
    }

    .price {
      padding: 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(245, 158, 11, .16), rgba(16, 185, 129, .12));
      border: 1px solid rgba(245, 158, 11, .35);
      display: grid;
      gap: 10px
    }

    .price-num {
      font-family: 'Inter';
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1
    }

    .price-num small {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600
    }

    .checks {
      list-style: none;
      display: grid;
      gap: 6px;
      text-align: left;
      font-size: .9rem
    }

    .checks li::before {
      content: "✓ ";
      color: var(--emerald);
      font-weight: 800
    }

    .safe {
      padding: 12px;
      border-radius: 14px;
      background: rgba(16, 185, 129, .1);
      border: 1px solid rgba(16, 185, 129, .3);
      font-size: .86rem;
      text-align: left
    }

    .sim {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .sim button {
      padding: 10px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: .8rem;
      font-weight: 600;
      text-align: left;
      line-height: 1.35
    }

    .sim button:hover {
      border-color: var(--amber)
    }

    .owner {
      padding: 14px;
      border-radius: 16px;
      border: 1px dashed rgba(167, 139, 250, .5);
      background: rgba(167, 139, 250, .06);
      display: grid;
      gap: 10px
    }

    /* ---------- Share view ---------- */
    .share-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 60px;
      display: grid;
      gap: 14px
    }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
      transform: translateX(-50%) translateY(20px);
      z-index: 100;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      font-size: .9rem;
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .5)
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    /* ---------- Animations ---------- */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.95) translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 10px 24px -10px rgba(245, 158, 11, .7)
      }

      50% {
        box-shadow: 0 10px 36px -4px rgba(245, 158, 11, .95)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    /* ---------- Responsive ---------- */
    @media (min-width:560px) {
      .brand-text {
        display: inline
      }

      .dims {
        grid-template-columns: 1fr 1fr
      }

      .dream {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    @media (max-width:420px) {
      .form-grid {
        grid-template-columns: 1fr
      }

      .feat {
        grid-template-columns: 1fr
      }

      .money .stat b {
        font-size: .98rem
      }
    }

    @media (min-width:860px) {
      .grid-2 {
        grid-template-columns: 1.35fr 1fr;
        align-items: start
      }

      .grid-2b {
        grid-template-columns: 1fr 1fr;
        align-items: start
      }

      .dims {
        grid-template-columns: repeat(3, 1fr)
      }

      .guide-layout {
        grid-template-columns: 320px 1fr;
        align-items: start
      }
    }

    @media (min-width:1024px) {
      .bottom-nav {
        top: 0;
        bottom: 0;
        right: auto;
        width: var(--side-w);
        height: auto;
        flex-direction: column;
        justify-content: flex-start;
        gap: 6px;
        padding: 20px 14px;
        border-top: 0;
        border-right: 1px solid var(--border)
      }

      .side-brand {
        display: flex;
        margin: 0 6px 22px
      }

      .nav-btn {
        flex: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
        padding: 13px 16px;
        font-size: .95rem
      }

      .nav-btn.on::before {
        inset: 0
      }

      .app-shell {
        padding-left: var(--side-w);
        padding-bottom: 30px
      }

      .topbar .brand {
        display: none
      }

      #toast {
        bottom: 28px;
        left: calc(50% + var(--side-w)/2)
      }

      main {
        padding: 22px 26px
      }
    }

    /* ---------- i18n + payment additions ---------- */
    .lang-btn {
      min-width: 44px;
      height: 36px;
      padding: 0 10px;
      border-radius: 12px;
      font-family: 'Inter';
      font-weight: 800;
      font-size: .78rem;
      background: var(--surface-2);
      border: 1px solid var(--border)
    }

    .auth-lang {
      display: flex;
      justify-content: flex-end
    }

    .pay-opts {
      display: grid;
      gap: 10px
    }

    .pay-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      text-align: left;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      transition: border .2s, transform .15s
    }

    .pay-opt:hover {
      border-color: var(--amber)
    }

    .pay-opt:active {
      transform: scale(.98)
    }

    .pay-opt .pay-ico {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: linear-gradient(135deg, rgba(245, 158, 11, .22), rgba(16, 185, 129, .18))
    }

    .pay-opt span:nth-child(2) {
      flex: 1;
      min-width: 0
    }

    .pay-opt b {
      display: block
    }

    .pay-opt small {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35
    }

    .pay-opt em {
      font-style: normal;
      font-family: 'Inter';
      font-weight: 800;
      color: var(--amber)
    }

    .pay-badges {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap
    }

    /* ---------- Drag & drop sorting (touch friendly) ---------- */
    .drag-handle {
      flex: none;
      width: 26px;
      min-height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--muted);
      font-size: 1.05rem;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background .2s, color .2s
    }
    .drag-handle:hover { background: var(--surface-3); color: var(--text) }
    .drag-handle:active { cursor: grabbing }
    .dragging {
      position: relative;
      z-index: 5;
      opacity: .95;
      outline: 2px solid var(--amber);
      box-shadow: 0 16px 34px -12px rgba(0, 0, 0, .55);
      transform: scale(1.015)
    }
    body.is-dragging, body.is-dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing }
    .sort-hint { font-size: .74rem; color: var(--muted); display: flex; align-items: center; gap: 4px }

    /* ---------- Project top row, steps & activities ---------- */
    .proj-top { display: flex; align-items: center }
    .proj-top .drag-handle { margin-left: 10px }
    .proj-top .proj-head { flex: 1; min-width: 0 }
    .step { flex-wrap: wrap }
    .step-row { display: flex; align-items: center; gap: 6px; width: 100% }
    .step-title { flex: 1; min-width: 0; text-align: left; display: grid; gap: 2px; padding: 2px 0 }
    .step-title span { font-weight: 600; word-break: break-word }
    .step-title small { font-size: .74rem }
    .step-detail {
      width: 100%;
      display: grid;
      gap: 12px;
      margin-top: 8px;
      padding: 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      animation: fadeUp .25s ease
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .span-btns { display: flex; gap: 6px; flex-wrap: wrap }
    .span-btns .btn { min-height: 32px; padding: 4px 10px; font-size: .76rem }
    .acts { list-style: none; display: grid; gap: 6px }
    .act { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: var(--surface-2) }
    .act.done .act-title { text-decoration: line-through; opacity: .6 }
    .act .check { width: 26px; height: 26px; margin: 0; border-radius: 8px }
    .act-title { font-weight: 600; font-size: .88rem; word-break: break-word }
    .act-form { display: grid; gap: 8px; grid-template-columns: 2fr 1fr 1fr 1fr }
    .act-form .full { grid-column: 1/-1 }
    .mini-check { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted) }
    .mini-check input { width: 18px; height: 18px; accent-color: var(--amber) }
    .g-panel { padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(56, 189, 248, .08), rgba(167, 139, 250, .08)); border: 1px solid rgba(56, 189, 248, .25) }
    .g-status { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--surface-2) }
    .g-status.on { color: var(--emerald); background: rgba(16, 185, 129, .12) }
    .link-ico { width: 18px; height: 18px; flex: none }

    /* ---------- Gantt timeline (months → years) ---------- */
    .gantt-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--border); background: var(--surface-2); -webkit-overflow-scrolling: touch }
    .gantt { position: relative; min-width: max-content }
    .g-row { display: grid; grid-template-columns: var(--lw, 210px) var(--w); min-height: 40px; border-bottom: 1px solid var(--border) }
    .g-row:last-child { border-bottom: 0 }
    .g-label { position: sticky; left: 0; z-index: 2; background: var(--surface-2); padding: 8px 10px; font-size: .82rem; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--border); min-width: 0 }
    .g-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .g-row.g-proj .g-label { font-weight: 800; color: var(--violet) }
    .g-head { position: sticky; top: 0; z-index: 3; background: var(--surface) }
    .g-head .g-label { background: var(--surface); font-weight: 700 }
    .g-units { display: flex }
    .g-unit { flex: none; font-size: .72rem; font-weight: 700; color: var(--muted); padding: 10px 6px; border-left: 1px solid var(--border); text-align: center; white-space: nowrap }
    .g-track { position: relative; background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--cw) - 1px), var(--border) calc(var(--cw) - 1px) var(--cw)) }
    .g-bar { position: absolute; top: 9px; height: 22px; border-radius: 8px; min-width: 8px; background: var(--bc); color: #0b1220; font-size: .7rem; font-weight: 800; padding: 0 8px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; box-shadow: 0 6px 14px -8px var(--bc); transition: transform .15s }
    .g-bar:hover { transform: translateY(-1px) }
    .g-proj .g-bar { top: 15px; height: 10px; padding: 0; background: linear-gradient(90deg, var(--violet), var(--sky)) }
    .g-dot { position: absolute; top: 14px; width: 12px; height: 12px; transform: translateX(-6px) rotate(45deg); background: var(--amber); border: 2px solid var(--surface); border-radius: 2px; z-index: 1 }
    .g-dot.done { background: var(--emerald) }
    .g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rose); z-index: 1; pointer-events: none }
    .g-today::after { content: attr(data-l); position: absolute; top: 2px; left: 4px; font-size: .62rem; font-weight: 800; color: var(--rose); white-space: nowrap }

    /* ---------- Days off ---------- */
    .wd-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px }
    .wd-pick button { min-height: 42px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; color: var(--muted); transition: all .2s }
    .wd-pick button.on { background: linear-gradient(135deg, var(--emerald), #059669); color: #04150f; border-color: transparent; box-shadow: 0 8px 18px -10px var(--emerald) }
    .cockpit.offday { border-color: rgba(16, 185, 129, .45); background: radial-gradient(120% 120% at 100% 0%, rgba(16, 185, 129, .18), transparent 60%), radial-gradient(90% 90% at 0% 100%, rgba(56, 189, 248, .14), transparent 60%), var(--surface) }
    .digest-box { margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border) }
    .digest-preview { margin-top: 8px; font-size: .8rem; line-height: 1.55; white-space: pre-line; color: var(--muted) }

    /* ---------- Report ---------- */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
    .kpi { padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border) }
    .kpi b { display: block; font-family: 'Inter'; font-size: 1.5rem; font-weight: 800 }
    .kpi span { font-size: .78rem; color: var(--muted) }
    .hbar { display: grid; grid-template-columns: minmax(90px, 1.2fr) 3fr auto; gap: 10px; align-items: center; font-size: .84rem; padding: 6px 0 }
    .hbar .bar { height: 10px }
    .rep-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
    .chart-wrap svg { display: block; width: 100%; height: auto }

    /* ---------- Planner guide ---------- */
    .pg-guide { padding: 0; overflow: hidden; margin-bottom: 14px; border-color: rgba(245, 158, 11, .3) }
    .pg-guide summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 8px; font-weight: 800; background: linear-gradient(90deg, rgba(245, 158, 11, .12), transparent) }
    .pg-guide summary::-webkit-details-marker { display: none }
    .pg-guide summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .2s }
    .pg-guide[open] summary::after { transform: rotate(180deg) }
    .pg-body { padding: 4px 16px 16px; display: grid; gap: 14px }
    .pg-secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
    .pg-sec { text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); font-size: .8rem; line-height: 1.45; transition: all .2s }
    .pg-sec b { display: block; font-size: .9rem; margin-bottom: 2px }
    .pg-sec.on { border-color: var(--amber); background: rgba(245, 158, 11, .1) }
    .pg-sec:hover { transform: translateY(-1px) }
    .pg-body ol, .pg-body ul { padding-left: 20px; display: grid; gap: 6px; font-size: .86rem; line-height: 1.55 }
    .pg-ex li { list-style: none; margin-left: -20px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); border-left: 3px solid var(--emerald) }

    .link-ico svg { width: 100%; height: 100%; display: block }
    .btn .link-ico { margin-right: 6px; display: inline-block; vertical-align: -3px }
    .bottom-nav .nav-btn { min-width: 0; white-space: nowrap; letter-spacing: -.01em }
    @media (max-width: 400px) { .bottom-nav .nav-btn { font-size: .6rem } .bottom-nav .nav-btn .ico { font-size: 1.2rem } }
    .wd-pick button[aria-pressed=true] { color: #04150f }
    .g-label small { flex: none; font-size: .7rem }

    /* ---------- Calendar page ---------- */
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
    .cal-dow { font-size: .72rem; font-weight: 700; color: var(--muted); text-align: center; padding: 4px 0 }
    .cal-cell { min-height: 92px; display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); text-align: left; overflow: hidden; transition: border-color .15s, transform .15s }
    .cal-cell:hover { border-color: var(--amber); transform: translateY(-1px) }
    .cal-cell.out { opacity: .45 }
    .cal-cell.off { background: linear-gradient(180deg, rgba(16, 185, 129, .13), var(--surface-2)) }
    .cal-cell.sel { outline: 2px solid var(--amber); outline-offset: -1px }
    .cal-n { font-family: 'Inter'; font-weight: 800; font-size: .8rem; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none }
    .cal-cell.today .cal-n { background: linear-gradient(135deg, var(--amber), #ea580c); color: #1a1205 }
    .cal-evs { display: grid; gap: 2px; min-width: 0 }
    .cal-pill { font-style: normal; font-size: .66rem; font-weight: 600; padding: 1px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(56, 189, 248, .18); color: var(--sky) }
    .cal-pill.t { background: rgba(245, 158, 11, .16); color: var(--amber) }
    .cal-pill.s { background: rgba(167, 139, 250, .18); color: var(--violet) }
    .cal-pill.more { background: none; color: var(--muted) }
    .cal-list { list-style: none; display: grid; gap: 8px }
    .cal-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border-left: 3px solid var(--sky) }
    .cal-item.t { border-left-color: var(--amber) }
    .cal-item.s { border-left-color: var(--violet) }
    .cal-item .grow { flex: 1; min-width: 0; word-break: break-word }
    .cal-time { font-family: 'Inter'; font-size: .74rem; font-weight: 700; color: var(--muted); min-width: 84px; padding-top: 2px }

    /* ---------- Finance ---------- */
    .fin-kind { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
    .fin-kind label { position: relative }
    .fin-kind input { position: absolute; opacity: 0; pointer-events: none }
    .fin-kind span { display: block; text-align: center; padding: 11px; border-radius: 14px; background: var(--surface-2); border: 1.5px solid var(--border); font-weight: 800; cursor: pointer; transition: all .2s }
    .fin-kind input:checked + span.exp { border-color: var(--rose); background: rgba(251, 113, 133, .12); color: var(--rose) }
    .fin-kind input:checked + span.inc { border-color: var(--emerald); background: rgba(16, 185, 129, .12); color: var(--emerald) }
    .fin-kind input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px }
    .amt-inc { color: var(--emerald); white-space: nowrap }
    .amt-exp { color: var(--rose); white-space: nowrap }
    .txns { list-style: none; display: grid; gap: 6px }
    .txn { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: var(--surface-2) }
    .txn-ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-3); flex: none; font-size: 1.1rem }
    .txn .grow { flex: 1; min-width: 0 }
    .txn .grow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .r-add { font-size: .95rem; flex: none }
    .hour { grid-template-columns: 58px 1fr auto }
    .inc-box { margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border) }
    .inc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px }
    .inc-list { list-style: none; display: grid; gap: 6px; max-height: 230px; overflow-y: auto; padding-right: 2px }
    .inc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-3); font-size: .88rem }
    .inc-item .grow { flex: 1; min-width: 0 }
    .inc-item .grow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem }
    .inc-item .grow small { color: var(--muted); font-size: .74rem }
    .inc-item .amt { font-family: 'Inter'; font-weight: 700; color: var(--emerald); white-space: nowrap }
    .inc-presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px }
    .inc-presets button { font-size: .76rem; padding: 3px 8px; border-radius: 8px; background: var(--surface-3); border: 1px solid var(--border); color: var(--muted); transition: all .15s }
    .inc-presets button:hover { color: var(--text); border-color: var(--emerald); background: rgba(16, 185, 129, .12) }

    /* ---------- Tax ---------- */
    .tax-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
    .tax-mode button { padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1.5px solid var(--border); text-align: left; font-size: .8rem; line-height: 1.45; color: var(--muted); transition: all .2s }
    .tax-mode button b { display: block; font-size: 1rem; color: var(--text); margin-bottom: 2px }
    .tax-mode button.on { border-color: var(--amber); background: linear-gradient(135deg, rgba(245, 158, 11, .14), rgba(16, 185, 129, .06)); box-shadow: 0 10px 24px -16px var(--amber) }
    .tax-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px }
    .tax-grid .field small, .tax-h small { color: var(--muted); font-size: .7rem; font-weight: 500 }
    .tax-h { margin: 16px 0 8px; font-size: .92rem }
    .tax-layout { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start }
    .tax-side { position: sticky; top: 90px }
    .tax-big { margin: 12px 0; padding: 14px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; flex-wrap: wrap }
    .tax-big b { font-size: 1.5rem }
    .tax-big.due { background: rgba(251, 113, 133, .12); color: var(--rose); border: 1px solid rgba(251, 113, 133, .35) }
    .tax-big.refund { background: rgba(16, 185, 129, .12); color: var(--emerald); border: 1px solid rgba(16, 185, 129, .35) }
    .tax-sum { display: grid }
    .tax-line { display: flex; justify-content: space-between; gap: 10px; font-size: .86rem; padding: 6px 0; border-bottom: 1px dashed var(--border) }
    .tax-line b { font-family: 'Inter'; white-space: nowrap }
    .tax-line.sub { font-weight: 800 }
    .tax-line.ded { color: var(--muted); font-size: .8rem; padding: 3px 0 3px 8px }
    .tax-br { margin-top: 12px }
    .tax-br summary { cursor: pointer; font-weight: 700; font-size: .86rem }
    .tax-table { width: 100%; border-collapse: collapse; font-size: .78rem; margin-top: 8px }
    .tax-table th, .tax-table td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--border) }
    .tax-table th:first-child, .tax-table td:first-child { text-align: left }
    .tax-table tr.muted { opacity: .45 }
    .tax-tips, .tax-compare { margin-top: 14px; display: grid; gap: 8px }
    .tax-tip { padding: 10px 12px; border-radius: 12px; background: rgba(16, 185, 129, .08); border-left: 3px solid var(--emerald); font-size: .84rem; line-height: 1.5 }
    .tax-tip.warn { background: rgba(245, 158, 11, .1); border-left-color: var(--amber) }
    .tax-compare { padding: 12px; border-radius: 14px; background: var(--surface-2) }
    @media (max-width: 900px) { .tax-layout { grid-template-columns: 1fr } .tax-side { position: static } }
    @media (max-width: 520px) { .bottom-nav { padding-left: 2px; padding-right: 2px } .bottom-nav .nav-btn { font-size: .58rem; letter-spacing: -.02em } .bottom-nav .nav-btn .ico { font-size: 1.12rem } }
    @media (max-width: 640px) {
      .cal-cell { min-height: 56px; padding: 4px; border-radius: 10px }
      .cal-evs { grid-template-columns: repeat(auto-fill, minmax(8px, 1fr)); gap: 2px }
      .cal-pill { font-size: 0; padding: 0; height: 6px; border-radius: 3px; background: var(--sky) }
      .cal-pill.t { background: var(--amber) }
      .cal-pill.s { background: var(--violet) }
      .cal-pill.more { font-size: .56rem; height: auto; background: none; grid-column: 1/-1 }
      .tax-mode { grid-template-columns: 1fr }
    }
    @media (max-width: 640px) {
      .act-form { grid-template-columns: 1fr 1fr }
      .act-form input[name=title] { grid-column: 1/-1 }
      .g-row { --lw: 132px }
      .rep-filters { grid-template-columns: 1fr }
      .hbar { grid-template-columns: 80px 1fr auto }
    }
  </style>
</head>

<body>

  <div id="share-view" hidden></div>
  <section id="auth-screen" class="auth" hidden></section>

  <div id="app" hidden>
    <nav class="bottom-nav" id="bottom-nav"></nav>
    <div class="app-shell">
      <div class="topwrap">
        <div id="trial-banner" class="banner"></div>
        <header class="topbar">
          <div class="brand"><span class="brand-logo"><img src="/icon-192.png?v=2" alt="FlowRecover"></span><span class="brand-text brand-word">FlowRecover</span></div>
          <form class="idea-box" data-form="idea" id="idea-form" autocomplete="off">
            <input class="input" name="idea" id="idea-input" enterkeyhint="done">
          </form>
          <button class="icon-btn badge-btn" data-act="ideas" id="btn-ideas">🗒️<b id="idea-count" hidden>0</b></button>
          <button class="lang-btn" data-act="lang" id="btn-lang"></button>
          <button class="icon-btn" data-act="theme" id="btn-theme">🌙</button>
          <button class="avatar" data-act="account" id="btn-account"></button>
        </header>
      </div>
      <main>
        <section class="view" id="view-focus" hidden></section>
        <section class="view" id="view-queue" hidden></section>
        <section class="view" id="view-projects" hidden></section>
        <section class="view" id="view-planner" hidden></section>
        <section class="view" id="view-calendar" hidden></section>

    function ensureCgItems(date, mk) {
      let changed = false;
      const splitLines = str => String(str || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);

      // 1. 5-Dimension Goals
      DIMS.forEach(d => {
        P().goals[d.k] ||= {};
        const G = P().goals[d.k];
        if (!Array.isArray(G.items)) {
          G.items = splitLines(G.goal).map(text => ({ id: uid(), text, done: false }));
          if (G.goal) G.goal = "";
          changed = true;
        }
      });

      // 2. Monthly Focus (focus & tell + topic groups)
      if (mk) {
        P().monthly[mk] ||= {};
        const M = P().monthly[mk];
        if (!Array.isArray(M.focusItems)) {
          M.focusItems = splitLines(M.focus).map(text => ({ id: uid(), text, done: false }));
          if (M.focus) M.focus = "";
          changed = true;
        }
        if (!Array.isArray(M.focusGroups)) {
          M.focusGroups = [];
          changed = true;
        } else {
          M.focusGroups.forEach(g => { g.items ||= []; });
        }
        if (!Array.isArray(M.tellItems)) {
          M.tellItems = splitLines(M.tell).map(text => ({ id: uid(), text, done: false }));
          if (M.tell) M.tell = "";
          changed = true;
        }
      }

      // 3. Daily 24h Plan
      if (date) {
        P().daily[date] ||= {};
        const D = P().daily[date];
        D.planItems ||= {};
        for (let h = 0; h < 24; h++) {
          const hk = `h${pad(h)}`;
          if (!Array.isArray(D.planItems[hk])) {
            const legacy = D.plan?.[hk];
            D.planItems[hk] = splitLines(legacy).map(text => ({ id: uid(), text, done: false }));
            if (D.plan && D.plan[hk]) D.plan[hk] = "";
            if (legacy) changed = true;
          }
        }
      }

      // 4. Dream Board
      DREAM.forEach(d => {
        P().dreamItems ||= {};
        if (!Array.isArray(P().dreamItems[d.k])) {
          const legacy = P().dream?.[d.k];
          P().dreamItems[d.k] = splitLines(legacy).map(text => ({ id: uid(), text, done: false }));
          if (P().dream && P().dream[d.k]) P().dream[d.k] = "";
          if (legacy) changed = true;
        }
      });

      if (changed) save();
    }

    function ensureRoutineHabits() {
      const H = (P().habits ||= []);
      const L = (P().habitLog ||= {});
      state.routines.forEach(r => {
        let h = H.find(x => x.routineId === r.id);
        if (!h) {
          h = H.find(x => !x.routineId && x.name.trim().toLowerCase() === r.title.trim().toLowerCase());
          if (h) h.routineId = r.id;
          else { h = { id: uid(), name: r.title, routineId: r.id }; H.push(h); }
        } else {
          h.name = r.title;
        }
        r.habitId = h.id;
        L[h.id] ||= {};
        r.log ||= {};
        Object.entries(r.log).forEach(([d, v]) => { if (v) L[h.id][d] = true; });
        Object.entries(L[h.id]).forEach(([d, v]) => { if (v) r.log[d] = true; });
      });
    }
    function habitRoutine(h) {
      return state.routines.find(r => r.id === h.routineId || r.habitId === h.id || r.title.trim().toLowerCase() === h.name.trim().toLowerCase()) || null;

      if (r) return streak(r);

      let d = dkey(); if (!lg[d]) d = addDays(d, -1);
      let s = 0; for (let i = 0; i < 500 && d; i++) { if (lg[d]) { s++; d = addDays(d, -1); } else break; }
      return s;

    function habitRange() {

      if (V.range === "month") return [dkey(new Date(d.getFullYear(), d.getMonth(), 1)), dkey(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
      return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`];

    function habitTitle() {

      if (V.range === "month") return LANG === "en" ? `${MONTHS.en[d.getMonth()]} ${d.getFullYear()}` : `${MONTHS.th[d.getMonth()]} ${d.getFullYear() + 543}`;

    function habitReportData() {
      ensureRoutineHabits();
      const V = habitView(), [a, b] = habitRange(), today = dkey(), endCap = b < today ? b : today;
      const days = [];
      for (let d = a; d <= b; d = addDays(d, 1)) days.push(d);
      const habits = P().habits || [], HLog = P().habitLog || {};
      const items = habits.map((h, idx) => {
        const r = habitRoutine(h), lg = HLog[h.id] || {};
        let due = 0, done = 0;
        days.forEach(d => {
          const isd = isHabitDue(h, d);
          if (d <= endCap && isd && (!r?.created || d >= r.created)) due++;
          if (lg[d]) done++;
        });
        const pct = due ? Math.min(100, Math.round(done / due * 100)) : (done ? 100 : 0);
        return { h, r, lg, due: Math.max(due, done), done, pct, streak: habitStreak(h), c: PALETTE[idx % PALETTE.length] };
      });
      const bk = [];
      if (V.range === "year") {
        for (let m = 0; m < 12; m++) {
          const pre = a.slice(0, 5) + pad(m + 1);
          const mDays = days.filter(d => d.startsWith(pre));
          let t = 0, d = 0;
          mDays.forEach(day => habits.forEach(h => {
            if (day <= endCap && isHabitDue(h, day)) t++;
            if (HLog[h.id]?.[day]) d++;

          bk.push({ l: MONTHS[LANG][m], k: pre, t: Math.max(t, d), d });

        days.forEach(day => {
          let t = 0, d = 0;
          habits.forEach(h => {

            if (HLog[h.id]?.[day]) d++;

      return { a, b, days, items, bk, totalDone, totalDue, avgPct, topStreak };
    }

    function tripStats(t) {
      const budget = Math.max(0, Number(t.budget) || 0);
      const saved = Math.max(0, Number(t.saved) || 0);
      const remain = Math.max(0, budget - saved);
      const pct = budget > 0 ? Math.min(100, Math.round((saved / budget) * 100)) : (saved > 0 ? 100 : 0);
      const today = dkey();
      const daysLeft = t.date ? Math.ceil((parseD(t.date) - parseD(today)) / 86400000) : null;
      const monthsLeft = daysLeft !== null && daysLeft > 0 ? Math.max(1, Math.ceil(daysLeft / 30)) : 1;
      const perMonth = remain > 0 ? Math.ceil(remain / monthsLeft) : 0;
      const perDay = remain > 0 && daysLeft !== null && daysLeft > 0 ? Math.ceil(remain / daysLeft) : 0;
      const steps = (t.steps ||= []);
      const doneSteps = steps.filter(s => s.done).length;
      const stepPct = steps.length ? Math.round((doneSteps / steps.length) * 100) : 0;
      return { budget, saved, remain, pct, daysLeft, monthsLeft, perMonth, perDay, steps, doneSteps, stepPct };

    const adminUsersState = {
      loading: false,
      loaded: false,
      err: "",
      users: [],
      q: "",
      filter: "all" // all | pro | trial | expired | admin
    };
    const tsMs = v => {
      if (!v) return 0;
      if (typeof v === "number") return v;
      if (typeof v?.toMillis === "function") return v.toMillis();
      if (typeof v?.seconds === "number") return v.seconds * 1000;
      const p = Date.parse(v);
      return Number.isNaN(p) ? 0 : p;
    };
    function classifyUserRecord(u) {
      const email = (u.email || "").toLowerCase();
      const isAdm = !!(u.is_admin || u.plan === "lifetime_admin" || ADMIN_EMAILS.some(e => e.toLowerCase() === email));
      const createdMs = tsMs(u.created_at) || tsMs(u.trial_start_at) || Date.now();
      const trialStartMs = tsMs(u.trial_start_at) || createdMs;
      const lastLoginMs = tsMs(u.last_login_at) || tsMs(u.updated_at) || createdMs;
      const proSinceMs = tsMs(u.pro_since);
      const proUntilMs = tsMs(u.pro_until);
      const now = Date.now();

      // Calculate months subscribed
      let proMonths = Number(u.pro_months) || 0;
      if (!proMonths && (u.subscription_status === "pro" || proSinceMs > 0) && !isAdm) {
        if (proSinceMs > 0) {
          const endRef = proUntilMs > proSinceMs ? proUntilMs : now;
          proMonths = Math.max(1, Math.ceil((endRef - proSinceMs) / PASS_MS));
        } else {
          proMonths = 1;
        }
      }

      let statusKey = "trial"; // admin | pro | trial | expired
      let statusBadge = "";
      let planLabel = "";
      let detailLabel = "";

      if (isAdm) {
        statusKey = "admin";
        statusBadge = `<span class="pill pill-emerald">👑 Admin • ${L("ฟรีตลอดชีพ", "Lifetime")}</span>`;
        planLabel = L("สิทธิ์ Admin ตลอดชีพ", "Lifetime Admin");
        detailLabel = L("ใช้งานได้ไม่จำกัด", "Unlimited access");
      } else if (u.subscription_status === "pro" && (!proUntilMs || proUntilMs > now)) {
        statusKey = "pro";
        statusBadge = `<span class="pill pill-emerald">💎 PRO (${proMonths} ${L("เดือน", "mo")})</span>`;
        planLabel = u.plan === "card_subscription"
          ? L("💳 บัตรเครดิต/เดบิต (ต่ออายุอัตโนมัติ)", "💳 Card Auto-Renew")
          : u.plan === "promptpay_30d"
          ? L("📱 QR PromptPay (รายเดือน)", "📱 QR PromptPay")
          : L("💎 สมาชิก PRO รายเดือน", "💎 Monthly PRO");
        if (proUntilMs) {
          const remDays = Math.max(0, Math.ceil((proUntilMs - now) / 864e5));
          detailLabel = L(`ใช้ได้ถึง ${fmtDate(dkey(new Date(proUntilMs)))} (เหลือ ${remDays} วัน)`, `Until ${fmtDate(dkey(new Date(proUntilMs)))} (${remDays}d left)`);
        } else {
          detailLabel = L("ต่ออายุรายเดือนอัตโนมัติ (Active)", "Active monthly subscription");
        }
      } else {
        const remMs = trialStartMs + TRIAL_MS - now;
        const lapsedPro = u.subscription_status === "pro" && proUntilMs && proUntilMs <= now;
        if (lapsedPro || u.subscription_status === "canceled" || remMs <= 0) {
          statusKey = "expired";
          statusBadge = `<span class="pill pill-rose">🔒 ${lapsedPro ? L("PRO หมดอายุ", "PRO Expired") : u.subscription_status === "canceled" ? L("ยกเลิก PRO", "Canceled") : L("หมดทดลองฟรี", "Trial Expired")}</span>`;
          planLabel = lapsedPro ? L("เคยสมัคร PRO", "Past PRO Member") : L("🎁 ทดลองใช้ฟรี 7 วัน (หมดเวลา)", "🎁 7-Day Free Trial (Ended)");
          detailLabel = proUntilMs ? L(`หมดอายุเมื่อ ${fmtDate(dkey(new Date(proUntilMs)))}`, `Expired ${fmtDate(dkey(new Date(proUntilMs)))}`) : L(`เริ่มทดลองเมื่อ ${fmtDate(dkey(new Date(trialStartMs)))}`, `Trial started ${fmtDate(dkey(new Date(trialStartMs)))}`);
        } else {
          statusKey = "trial";
          const remDays = Math.max(1, Math.ceil(remMs / 864e5));
          statusBadge = `<span class="pill pill-amber">🎁 ${L(`ทดลองฟรี (เหลือ ${remDays} วัน)`, `Free Trial (${remDays}d left)`)}</span>`;
          planLabel = L("🎁 ทดลองใช้ฟรี 7 วัน", "🎁 7-Day Free Trial");
          detailLabel = L(`ครบกำหนด ${fmtDate(dkey(new Date(trialStartMs + TRIAL_MS)))}`, `Ends ${fmtDate(dkey(new Date(trialStartMs + TRIAL_MS)))}`);
        }
      }

      return {
        ...u,
        email,
        isAdm,
        statusKey,
        statusBadge,
        planLabel,
        detailLabel,
        proMonths,
        estRevenue: proMonths * 99,
        createdMs,
        trialStartMs,
        lastLoginMs,
        proSinceMs,
        proUntilMs,
        loginCount: Number(u.login_count) || 1
      };
    }

    async function loadAdminUsers(force = false) {
      if (adminUsersState.loading) return;
      if (!fb || !fb.getDocs || !fb.collection) {
        // Fallback for demo/local mode: show current user
        adminUsersState.users = state.user ? [{
          uid: state.user.uid,
          name: state.user.name,
          email: state.user.email,
          photo: state.user.photo,
          subscription_status: state.sub?.subscription_status || "trial",
          plan: state.sub?.plan || "",
          is_admin: state.sub?.is_admin || false,
          trial_start_at: state.sub?.trial_start_at || Date.now(),
          created_at: state.sub?.trial_start_at || Date.now(),
          last_login_at: Date.now(),
          login_count: 1,
          auth_provider: state.user.demo ? "demo" : "google.com"
        }] : [];
        adminUsersState.loaded = true;
        if (state.tab === "users") renderUsers();
        return;
      }
      adminUsersState.loading = true;
      adminUsersState.err = "";
      if (state.tab === "users") renderUsers();
      try {
        const snap = await fb.getDocs(fb.collection(fb.db, "users"));
        const list = [];
        snap.forEach(docSnap => {
          list.push({ uid: docSnap.id, ...docSnap.data() });
        });
        // Ensure current logged-in user is in the list
        if (state.user?.uid && !list.some(x => x.uid === state.user.uid)) {
          list.push({
            uid: state.user.uid,
            name: state.user.name,
            email: state.user.email,
            photo: state.user.photo,
            subscription_status: state.sub?.subscription_status || "trial",
            plan: state.sub?.plan || "",
            is_admin: isUserAdmin(),
            trial_start_at: state.sub?.trial_start_at || Date.now(),
            created_at: state.sub?.trial_start_at || Date.now(),
            last_login_at: Date.now()
          });
        }
        adminUsersState.users = list;
        adminUsersState.loaded = true;
        if (force) toast(L(`🔄 โหลดข้อมูลผู้ใช้ ${list.length} บัญชีเรียบร้อย`, `🔄 Loaded ${list.length} user accounts`));
      } catch (e) {
        console.error("loadAdminUsers error:", e);
        adminUsersState.err = e.message || String(e);
      } finally {
        adminUsersState.loading = false;
        if (state.tab === "users") renderUsers();
      }
    }

        if (lost > 0) {

      startSleep: d => {
        let targetEndMs;

          const target = new Date();

            target.setDate(target.getDate() + 1);
          }
          targetEndMs = target.getTime();
          wakeTimeStr = String(d.wakeTime);
          targetHours = Math.round(((targetEndMs - now.getTime()) / 3600000) * 10) / 10;

          : L(`🌙 เข้าสู่โหมดนอนหลับ (เป้าหมายตื่น ${wakeTimeStr} น.) — หลับฝันดี ชาร์จพลังให้เต็มที่ครับ 😴`, `🌙 Sleep mode started (Wake target ${wakeTimeStr}) — Sleep well & recharge! 😴`);

    async function uploadToDriveAndAttach(fileList) {

            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: form
          });

            const j = await r.json().catch(() => ({}));

        if (fd.step) t.stepId = fd.step;

        rerender(); toast(L(`📆 เพิ่ม "${trunc(title, 24)}" ลง Timeline แล้ว`, `📆 Added "${trunc(title, 24)}" to the timeline`));

        if (!to || from === to.id) { toast(L("เลือกขั้นตอนต้นทางและปลายทางที่ต่างกัน", "Choose two different steps")); return; }
        if (!p.steps.some(s => (s.deps || []).length)) p.steps.forEach((s, i) => { s.deps = i ? [p.steps[i - 1].id] : []; });

    /* =====================================================================
       Extensions II: Google Calendar delete/update/pull • Calendar page
